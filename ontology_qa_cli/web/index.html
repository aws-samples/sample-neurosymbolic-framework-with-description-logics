<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ontology QA — Chatbot</title>
  <style>
    :root {
      --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b; --border: #2a2f3a;
      --text: #e6e8ec; --muted: #9aa3b2; --accent: #4c8bf5; --accent-2: #2f6bd6;
      --user: #23374d; --bot: #1e222b; --danger: #e5534b; --ok: #3fb950;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); display: flex; flex-direction: column;
    }
    header {
      display: flex; align-items: center; gap: 16px; padding: 12px 20px;
      background: var(--panel); border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; white-space: nowrap; }
    header .spacer { flex: 1; }
    label { color: var(--muted); font-size: 13px; }
    select {
      background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 10px; font-size: 14px; min-width: 220px;
    }
    #status-pill {
      font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border);
      color: var(--muted);
    }
    #status-pill.ready { color: var(--ok); border-color: var(--ok); }
    #status-pill.building { color: var(--accent); border-color: var(--accent); }
    #status-pill.error { color: var(--danger); border-color: var(--danger); }
    main { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .msg { max-width: 760px; padding: 12px 14px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; }
    .msg.user { align-self: flex-end; background: var(--user); }
    .msg.bot { align-self: flex-start; background: var(--bot); border: 1px solid var(--border); }
    .msg.system { align-self: center; background: transparent; color: var(--muted); font-size: 13px; text-align: center; max-width: 90%; }
    .msg .rewrite { color: var(--muted); font-size: 12px; margin-bottom: 6px; font-style: italic; }
    .build { align-self: center; max-width: 760px; width: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
    .build h3 { margin: 0 0 8px; font-size: 14px; }
    .build pre { margin: 8px 0 0; max-height: 220px; overflow: auto; background: #0b0d11; color: #c9d1d9; padding: 10px; border-radius: 8px; font-size: 12px; }
    .dots::after { content: ""; animation: dots 1.4s steps(4, end) infinite; }
    @keyframes dots { 0%{content:"";} 25%{content:".";} 50%{content:"..";} 75%{content:"...";} }
    footer { padding: 14px 20px; background: var(--panel); border-top: 1px solid var(--border); }
    .composer { display: flex; gap: 10px; max-width: 900px; margin: 0 auto; }
    textarea {
      flex: 1; resize: none; background: var(--panel-2); color: var(--text);
      border: 1px solid var(--border); border-radius: 10px; padding: 12px; font: inherit; min-height: 44px; max-height: 160px;
    }
    button {
      background: var(--accent); color: white; border: none; border-radius: 10px;
      padding: 0 18px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: var(--accent-2); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>Ontology QA</h1>
    <label for="ontology">Ontology</label>
    <select id="ontology"><option value="">Loading…</option></select>
    <span id="status-pill">idle</span>
    <span class="spacer"></span>
    <button id="reset" title="Clear the conversation">Reset chat</button>
  </header>

  <main id="transcript"></main>

  <footer>
    <div class="composer">
      <textarea id="input" placeholder="Select an ontology, then ask a question…" disabled></textarea>
      <button id="send" disabled>Send</button>
    </div>
  </footer>

  <script>
  // Minimal React-like state container — a single render() re-derives the UI
  // from `state`. The future React app maps 1:1 onto these API calls.
  const api = {
    ontologies: () => fetch("/api/ontologies").then(r => r.json()),
    select: (ontology) => post("/api/select", { ontology }),
    status: (jobId) => fetch(`/api/status/${jobId}`).then(r => r.json()),
    conversation: (ontology) => post("/api/conversation", { ontology }),
    chat: (conversation_id, message) => post("/api/chat", { conversation_id, message }),
  };
  function post(url, body) {
    return fetch(url, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    }).then(async r => {
      if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.detail || r.statusText); }
      return r.json();
    });
  }

  const state = {
    ontology: "",
    conversationId: null,
    phase: "idle",        // idle | building | ready | error
    messages: [],         // {role: user|bot|system, text, rewrite?}
    buildLog: "",
    error: null,
  };

  const el = (id) => document.getElementById(id);
  const transcript = el("transcript");

  function pill(text, cls) {
    const p = el("status-pill");
    p.textContent = text;
    p.className = cls || "";
  }

  function render() {
    transcript.innerHTML = "";
    for (const m of state.messages) {
      const div = document.createElement("div");
      div.className = `msg ${m.role}`;
      if (m.rewrite) {
        const r = document.createElement("div");
        r.className = "rewrite";
        r.textContent = `interpreted as: ${m.rewrite}`;
        div.appendChild(r);
      }
      div.appendChild(document.createTextNode(m.text));
      transcript.appendChild(div);
    }
    if (state.phase === "building") {
      const b = document.createElement("div");
      b.className = "build";
      b.innerHTML = `<h3>Building a query program for <b>${state.ontology}</b> <span class="dots"></span></h3>
        <div style="color:var(--muted);font-size:13px">No program exists yet for this ontology. Running the builder — this can take a while.</div>
        <pre>${escapeHtml(state.buildLog || "starting…")}</pre>`;
      transcript.appendChild(b);
    }
    transcript.scrollTop = transcript.scrollHeight;

    const chatReady = state.phase === "ready" && state.conversationId;
    el("input").disabled = !chatReady;
    el("send").disabled = !chatReady;
    el("input").placeholder = chatReady
      ? "Ask a question…"
      : (state.phase === "building" ? "Building the program — please wait…" : "Select an ontology, then ask a question…");
  }

  function escapeHtml(s) {
    return s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function addMessage(role, text, rewrite) {
    state.messages.push({ role, text, rewrite });
    render();
  }

  async function loadOntologies() {
    const { ontologies } = await api.ontologies();
    const sel = el("ontology");
    sel.innerHTML = "";
    const placeholder = document.createElement("option");
    placeholder.value = ""; placeholder.textContent = "Choose an ontology…";
    sel.appendChild(placeholder);
    for (const o of ontologies) {
      const opt = document.createElement("option");
      opt.value = o.name;
      opt.textContent = o.has_program ? o.name : `${o.name} (needs build)`;
      sel.appendChild(opt);
    }
  }

  async function onSelectOntology(ontology) {
    if (!ontology) return;
    state.ontology = ontology;
    state.conversationId = null;
    state.messages = [];
    state.error = null;
    addMessage("system", `Switching to ${ontology}…`);

    try {
      const res = await api.select(ontology);
      if (res.status === "ready") {
        await startConversation(ontology);
      } else if (res.status === "building") {
        state.phase = "building";
        pill(`building ${ontology}`, "building");
        render();
        pollBuild(res.job_id);
      }
    } catch (e) {
      state.phase = "error"; state.error = e.message;
      pill("error", "error");
      addMessage("system", `Error selecting ontology: ${e.message}`);
    }
  }

  async function pollBuild(jobId) {
    try {
      const s = await api.status(jobId);
      state.buildLog = s.log || "";
      render();
      if (s.status === "running") {
        setTimeout(() => pollBuild(jobId), 2000);
      } else if (s.status === "finished") {
        addMessage("system", `Build finished for ${state.ontology}. Starting chat.`);
        await startConversation(state.ontology);
      } else {
        state.phase = "error";
        pill("build failed", "error");
        addMessage("system", `Build failed for ${state.ontology}. See server log.`);
      }
    } catch (e) {
      state.phase = "error"; pill("error", "error");
      addMessage("system", `Error checking build status: ${e.message}`);
    }
  }

  async function startConversation(ontology) {
    const { conversation_id } = await api.conversation(ontology);
    state.conversationId = conversation_id;
    state.phase = "ready";
    pill(`ready · ${ontology}`, "ready");
    addMessage("system", `Ready. Ask questions about ${ontology}.`);
  }

  async function sendMessage() {
    const input = el("input");
    const text = input.value.trim();
    if (!text || !state.conversationId) return;
    input.value = "";
    addMessage("user", text);
    const thinking = { role: "bot", text: "…" };
    state.messages.push(thinking); render();
    try {
      const res = await api.chat(state.conversationId, text);
      thinking.text = res.answer == null ? "(no answer produced)" : res.answer;
      if (res.was_rewritten) thinking.rewrite = res.resolved_question;
    } catch (e) {
      thinking.text = `Error: ${e.message}`;
    }
    render();
  }

  // Wire up events.
  el("ontology").addEventListener("change", (e) => onSelectOntology(e.target.value));
  el("send").addEventListener("click", sendMessage);
  el("input").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  el("reset").addEventListener("click", async () => {
    if (!state.ontology) return;
    state.messages = [];
    await startConversation(state.ontology);  // new conversation id => fresh history
  });

  loadOntologies().then(render).catch(err => {
    addMessage("system", `Failed to load ontologies: ${err.message}`);
  });
  </script>
</body>
</html>
