[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ontology-qa-cli"
version = "0.1.0"
description = "A CLI tool for querying OWL DL ontologies using natural language"
requires-python = ">=3.10"
dependencies = [
    "owlready2>=0.45",
    "boto3>=1.34.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "hypothesis>=6.92.0",
    "pytest-mock>=3.12.0",
    "pytest-timeout>=2.3.0",
    "httpx>=0.27.0",
]
# Optional HTTP serving stack. Install with `uv sync --extra api`
# (or `pip install -e ".[api]"`). The core CLI (build/query/serve REPL)
# does not need these.
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    # Cognito JWT verification (RS256) for application-level auth (auth.py).
    # The `crypto` extra pulls in `cryptography` for RSA signature checks.
    "pyjwt[crypto]>=2.8.0",
    # Official MCP Python SDK. Pinned <2: the stable FastMCP API
    # (stateless_http / json_response kwargs + streamable_http_app()) lives in
    # 1.x; 2.x renamed FastMCP -> MCPServer and moved those knobs, which is a
    # migration we are not taking here.
    "mcp>=1.13,<2",
]

# uv's native dev dependency group. Installed by default with `uv sync`
# (and excluded from the published wheel, unlike optional-dependencies).
# The [project.optional-dependencies].dev entry above is kept as a mirror so
# plain `pip install -e ".[dev]"` still works for non-uv users.
[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "hypothesis>=6.92.0",
    "pytest-mock>=3.12.0",
    "pytest-timeout>=2.3.0",
    "httpx>=0.27.0",
]

[project.scripts]
ontology-qa-build = "ontology_qa_cli.builder:main"
ontology-qa-query = "ontology_qa_cli.query:main"
ontology-qa-serve = "ontology_qa_cli.serve:main"
ontology-qa-api = "ontology_qa_cli.api:main"
ontology-qa-chat = "ontology_qa_cli.chatbot:main"
ontology-qa-web = "ontology_qa_cli.webapp:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Fail a hung test fast instead of letting the suite run away (see the SSE
# deadlock that hung for 35 min). "thread" works even when the hang is in
# native code or a blocked event loop, where the default signal method cannot
# interrupt. Override per-test with @pytest.mark.timeout(N) for a slow case.
timeout = 60
timeout_method = "thread"

[tool.setuptools.packages.find]
include = ["ontology_qa_cli*"]
