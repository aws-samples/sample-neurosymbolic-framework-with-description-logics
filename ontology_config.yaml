# owl_file may be one of:
#   - a bare filename (e.g. "fma.owl")      -> resolved under <repo_root>/data/
#   - an absolute / ~ / relative path       -> used as-is
#   - an s3://bucket/key URI                 -> downloaded once to a local cache
#         (~/.cache/ontology-qa, override with ONTOLOGY_QA_CACHE_DIR) and reused
#         across runs. Keeps the large .owl out of local disk / the repo tree.
#         Requires AWS credentials with s3:GetObject on the object.
ontologies:
  - name: "FMA"
    owl_file: "s3://neurosymbolicdl-storage-ontologybucket795a3498-gjp5avevev34/ontologies/fma.owl"
    questions:
      - question: "What are the parts of the heart?"
        expected_answer: |
          The human heart is a four-chambered muscular organ comprising the
          right/left atria (upper chambers) and right/left ventricles (lower
          chambers). It includes four valves (tricuspid, pulmonary, mitral, 
          aortic) to control flow, the septum dividing the sides, and major
          vessels like the vena cava and aorta to pump blood.
      - question: "What is the function of the liver?"
        expected_answer: |
          The liver is a vital organ performing over 500 functions, primarily
          filtering toxins from over 250 gallons of blood daily, aiding digestion
          via bile production, and metabolizing nutrients. It regulates blood
          clotting, stores iron and vitamins, and maintains steady blood sugar
          levels. The liver is unique in its ability to regenerate, even if
          90% is removed
      - question: "Which organ system is the uterine tube part of?"
        expected_answer: |
          The uterine tube (or fallopian tube) is part of the female reproductive
          system. These paired tubes connect the ovaries to the uterus, serving
          as the pathway for the egg (ovum) to travel and as the primary site
          for fertilization.
      - question: "What is the smallest part of the small intestine?"
        expected_answer: |
          The smallest part of the small intestine is the duodenum. It is the
          first, shortest, and widest section, measuring approximately 10
          inches in length. in length. The duodenum connects the stomach
          to the jejunum and is C-shaped, wrapping around the head of the
          pancreas.
      - question: "What is the esophagus continuous with superiorly?"
        expected_answer: |
          The esophagus is continuous superiorly with the laryngopharynx
          (or laryngeal part of the pharynx).
      - question: "What is posterior to the esophagus?"
        expected_answer: |
          The primary structure posterior to the esophagus throughout its course
          is the vertebral column (spine), along with the prevertebral fascia and
          muscles. It is also closely related posteriorly to the descending
          thoracic aorta, the thoracic duct, and the azygos vein within the
          thoracic cavity.
      - question: "What surfaces bound the pleural cavity?"
        expected_answer: |
          The pleural cavity is a potential, fluid-filled space bounded by two
          layers of serous membrane, the visceral and parietal pleurae, which
          surround each lung. It is located entirely within the thoracic cavity.
      - question: "What is contained within the middle mediastinum?"
        expected_answer: |
          The middle mediastinum is the central and largest subdivision of the
          inferior mediastinum, primarily defined by the area occupied by the
          heart and its surrounding protective sac.
      - question: "What are the Latin synonyms for the uterine tube?"
        expected_answer: |
          The primary Latin term for the uterine tube is tuba uterina. Key
          synonyms, including Latinized Greek and historical terms, are salpinx
          (often used in plural as salpinges) and tuba Falloppii (or Fallopian
          tube), named after the anatomist Gabriele Falloppio. It is also 
          referred to as oviductus.
      - question: "What does the neural tube develop into?"
        expected_answer: |
          The neural tube is the embryonic precursor to the entire central
          nervous system (CNS), developing into the brain, spinal cord, and
          associated structures.
      - question: "What is the germ layer origin of the kidney?"
        expected_answer: |
          The kidney originates from the intermediate mesoderm. Specifically,
          this mesodermal region forms the urogenital ridge and the nephrogenic
          cord, which sequentially give rise to the pronephros, mesonephros,
          and the final, permanent kidney known as the metanephros.
      - question: "Is blood classified as solid or liquid?"
        expected_answer: |
          Blood is primarily classified as a liquid connective tissue. It is a
          fluid, but it is technically a mixture composed of about 55% liquid
          plasma and 45% solid cellular components (red blood cells, white blood
          cells, and platelets). It is often described as a non-Newtonian fluid,
          acting as a viscous fluid that can exhibit elastic properties.
      - question: "Is the carotid artery part of the circulatory system?"
        expected_answer: |
          Yes, the carotid arteries are a vital part of the circulatory system.
          They are major blood vessels in the neck that supply oxygen-rich
          blood directly to the brain, neck, and face.
  - name: "GO"
    owl_file: "s3://neurosymbolicdl-storage-ontologybucket795a3498-gjp5avevev34/ontologies/go-plus.owl"
    # The GO eval set has TWO complementary kinds of question so the evolved
    # program stays competent at BOTH:
    #   (a) factual single-gene annotation lookups, and
    #   (b) interpretive "practical meaning" of an experimental finding
    #       (typically a GO enrichment result).
    # Every expected_answer stays grounded in retrievable GO facts (annotations,
    # the enriched term's definition / parent process / child terms) and then
    # interprets them, so the neurosymbolic retrieval still drives the answer
    # rather than free speculation.
    questions:
      # --- (a) Factual single-gene annotation lookups ---
      - question: "Does TP53 interact with DNA?"
        expected_answer: |
          Yes, it has DNA-binding transcription factor activity.
      - question: "What happens when TP53 is active?"
        expected_answer: |
          It coordinates the apoptotic process (programmed cell death) and
          cell cycle arrest.
      - question: "Where does TP53 go to do its job?"
        expected_answer: |
          It is primarily found in the nucleus and cytoplasm, but can also
          relocate to the mitochondria during stress.
      - question: "What is BRCA1's main role in the cell?"
        expected_answer: |
          Its primary process is DNA repair, specifically repairing
          double-strand breaks.
      - question: "How does BRCA1 physically perform that repair?"
        expected_answer: |
          It exhibits ubiquitin-protein transferase activity,
          helping to flag other proteins for the repair process.
      - question: "Where is BRCA1 located during a 'crisis'?"
        expected_answer: |
          It localizes to nuclear replication forks and sites of DNA damage.
      - question: "What kind of receptor is EGFR?"
        expected_answer: |
          It has transmembrane receptor protein tyrosine kinase activity.
      - question: "Where is EGFR positioned to catch signals?"
        expected_answer: |
          It is anchored in the plasma membrane, with parts projecting
          outside the cell to "catch" growth factors.

      # --- (b) Interpretive "practical meaning" questions ---
      - question: |
          In a transcriptomic study of drug-resistant cancer cells, a scientist
          identifies 200 significantly upregulated genes. A GO enrichment
          analysis reveals a statistically significant enrichment for the term
          "microtubule cytoskeleton organization". What does this result mean
          practically?
        expected_answer: |
          Practically, it means the drug-resistant cells are preferentially
          turning up genes that build and reorganize the microtubule
          cytoskeleton. "Microtubule cytoskeleton organization" is the
          biological process of assembling and arranging microtubule-based
          structures, so enrichment implies these cells are investing in
          spindle formation, intracellular transport, and cell-shape/division
          machinery. Because microtubules are the target of taxanes and vinca
          alkaloids, this is a plausible resistance mechanism: the cells may be
          compensating for microtubule-targeting chemotherapy. The actionable
          read is that microtubule dynamics are a candidate driver of the
          resistant phenotype and a lead for follow-up.
      - question: |
          A GO enrichment analysis of genes upregulated after a viral infection
          shows strong enrichment for "defense response to virus". How should I
          interpret this biologically?
        expected_answer: |
          It means the up-regulated gene set is dominated by genes whose role is
          mounting an antiviral defense. "Defense response to virus" is the
          biological process of reacting to a virus to limit its replication or
          spread, so enrichment indicates the cells have switched on an
          antiviral program (interferon-stimulated and innate-immune effectors).
          Practically, the sample is responding as expected to infection, and
          the enriched term points you toward the immune-defense arm rather than,
          say, metabolism or proliferation.
      - question: |
          My differentially expressed genes are enriched for "oxidative
          phosphorylation". What does an enrichment for this process practically
          tell me about the cells?
        expected_answer: |
          Oxidative phosphorylation is the mitochondrial process that generates
          ATP by transferring electrons through the respiratory chain, so
          enrichment practically indicates a shift in the cells' energy
          metabolism toward mitochondrial ATP production. It suggests increased
          reliance on aerobic respiration rather than glycolysis, which can
          reflect higher energy demand or a metabolic reprogramming. The
          actionable interpretation is that mitochondrial/respiratory function
          is a distinguishing feature of this condition.
      - question: |
          A gene of interest is annotated with the cellular component
          "extracellular space". What does that localization practically imply
          about the protein's function?
        expected_answer: |
          Localization to the extracellular space practically implies the
          protein is secreted and acts outside the cell. That constrains its
          likely functions to things that happen externally: signaling to other
          cells, remodeling the extracellular matrix, or acting as a ligand,
          enzyme, or structural component in the surrounding environment. It
          also makes the protein a more accessible drug or biomarker target,
          since it is not sequestered inside the cell.
      - question: |
          Enrichment analysis of a tumor sample highlights "cell cycle" and
          "DNA replication". Practically, what does the co-enrichment of these
          processes suggest?
        expected_answer: |
          Together these point to actively proliferating cells. "Cell cycle" is
          the process controlling cell division and "DNA replication" is the
          copying of the genome that must precede each division, so
          co-enrichment practically means the sample is dominated by dividing
          cells synthesizing DNA. In a tumor context this is consistent with a
          high proliferative index and aggressive growth, and it flags
          cell-cycle/replication machinery as candidate therapeutic targets.
      - question: |
          Downregulated genes in a neurodegeneration model are enriched for
          "synaptic signaling". What is the practical significance of losing
          expression in this process?
        expected_answer: |
          "Synaptic signaling" is the process of transmitting signals across
          synapses between neurons, so losing expression there practically means
          the neurons' ability to communicate is being degraded. In a
          neurodegeneration model this suggests synaptic dysfunction and loss of
          connectivity as a mechanism of the disease phenotype, and it points to
          synaptic maintenance as a process to protect or restore.
      - question: |
          A screen returns enrichment for "response to oxidative stress".
          Practically, what state are these cells likely in?
        expected_answer: |
          "Response to oxidative stress" is the process cells use to counter
          damage from reactive oxygen species, so its enrichment practically
          indicates the cells are experiencing or defending against oxidative
          stress. They are likely upregulating antioxidant and damage-repair
          machinery, which signals an underlying stressful or damaging
          condition rather than a resting steady state.
      - question: |
          If a set of upregulated genes is enriched for "angiogenesis" in a
          tumor biopsy, what does that practically indicate about the tumor?
        expected_answer: |
          Angiogenesis is the process of forming new blood vessels, so
          enrichment practically indicates the tumor is driving new vessel
          growth to supply itself with oxygen and nutrients. This is a hallmark
          of growing, more aggressive tumors and flags the angiogenic program
          (e.g. VEGF-driven signaling) as a therapeutically targetable
          vulnerability.
      - question: |
          Enrichment analysis shows "inflammatory response" is significantly
          over-represented in a wound-healing time course. How do I read this
          practically?
        expected_answer: |
          "Inflammatory response" is the process of reacting to harmful stimuli
          or injury, so its over-representation in a wound-healing course
          practically means the inflammatory phase of healing is active in these
          samples. It indicates immune cells and signaling are engaged to clear
          damage and initiate repair, which is the expected early stage of
          wound healing rather than an abnormal finding.
      - question: |
          A GO term enriched in my dataset is "protein folding". Practically,
          what cellular situation does enrichment for this process most likely
          reflect?
        expected_answer: |
          "Protein folding" is the process of giving proteins their functional
          three-dimensional shape, often assisted by chaperones. Enrichment
          practically reflects increased demand for folding capacity, typically
          because the cells are under proteotoxic or ER stress, synthesizing
          large amounts of protein, or coping with misfolded proteins. The
          practical read is a stressed proteostasis state engaging the
          chaperone/quality-control machinery.

  - name: "CTO"
    owl_file: "s3://neurosymbolicdl-storage-ontologybucket795a3498-gjp5avevev34/ontologies/cto.owl"
    # Clinical Trial Ontology (CTO, OBO Foundry / BFO-based). The eval set has
    # two complementary kinds of question so the evolved program stays competent
    # at BOTH:
    #   (a) factual lookups of trial-design concepts CTO actually defines
    #       (phases, masking/blinding, allocation, eligibility, outcomes,
    #       registries), and
    #   (b) interpretive "what does this trial design mean / imply" questions.
    # Every expected_answer stays grounded in CTO's real class hierarchy and
    # definitions so the neurosymbolic retrieval drives the answer rather than
    # free speculation.
    questions:
      # --- (a) Factual trial-design concept lookups ---
      - question: "What clinical trial phases does the ontology define?"
        expected_answer: |
          The Clinical Trial Ontology defines the trial-phase concepts: early
          phase 1, phase 1, phase 1/2, phase 2, phase 2/3, phase 3, phase 4,
          and "phase not applicable" (for trials, such as many device or
          behavioral studies, where the drug-development phase model does not
          apply). These are subclasses of "clinical trial phase".
      - question: "What is a phase 1 clinical trial?"
        expected_answer: |
          A phase 1 clinical trial is the earliest human-testing phase, focused
          on evaluating the safety, tolerability, and pharmacokinetics of an
          intervention in a small group of participants, and on identifying
          side effects and a safe dosage range rather than proving efficacy.
      - question: "What kinds of masking (blinding) design does CTO describe?"
        expected_answer: |
          CTO represents masking design concepts including a double blinded
          design (neither the participants nor the investigators know the
          treatment assignment) and an open (open-label) design (the assignment
          is known to both). Masking design is how a trial controls for bias in
          how outcomes are reported and assessed.
      - question: "What is the difference between random and non-random allocation in a trial?"
        expected_answer: |
          Allocation is how participants are assigned to study arms. CTO
          distinguishes random allocation -- assignment by chance, which balances
          known and unknown confounders across arms and underpins causal
          inference -- from non-random allocation, where assignment follows a
          non-chance rule and is more susceptible to selection bias.
      - question: "What eligibility criteria concepts does the ontology represent?"
        expected_answer: |
          CTO represents eligibility concepts such as age-range criteria
          (birth-17 years, 18-64 years, older than 64), a healthy-volunteer
          criterion, and the notion of a healthy enrollee versus an enrolled
          patient. These define who may be recruited into a trial.
      - question: "What is a primary outcome measure?"
        expected_answer: |
          A primary outcome measure is the pre-specified result the trial is
          principally designed and powered to detect. CTO models primary outcome
          measure information and primary outcome measurement (with its outcome
          measurement datum) separately from other/secondary outcome measures,
          because the primary outcome is what the trial's success is judged on.
      - question: "What is a clinical trial sponsor role?"
        expected_answer: |
          The clinical trial sponsor role is the role borne by the organization
          or individual that takes responsibility for initiating, managing, and
          financing a clinical trial. In CTO it is a role (a realizable entity)
          rather than the organization itself.
      - question: "Name some clinical trial registries the ontology knows about."
        expected_answer: |
          CTO catalogs numerous national and regional trial registries, each with
          its identifier concept, including ClinicalTrials.gov, the EU Clinical
          Trials Register, the German clinical trials register, the Chinese,
          Indian, Japanese (JAPIC/JMACCT/jRCT), Korean, Iranian, Brazilian,
          Cuban, Peruvian, Lebanese, Pan African, and Australian New Zealand
          clinical trial registries, plus the ISRCTN register.

      # --- (b) Interpretive "what does this design imply" questions ---
      - question: |
          A trial is registered as a randomized, double-blind, placebo-controlled
          phase 3 study. What does that design mean practically, and what is it
          able to establish?
        expected_answer: |
          Practically this is a late-stage confirmatory efficacy trial. Phase 3
          means it tests the intervention in a large participant population to
          confirm effectiveness and monitor adverse reactions after safety was
          established earlier. Randomized allocation distributes known and unknown
          confounders evenly across arms, and double blinding keeps both
          participants and investigators unaware of assignment, controlling
          placebo effects and assessment bias. Placebo control gives the
          comparison baseline. Together these make it the strongest ordinary
          design for establishing a causal efficacy claim -- the kind of pivotal
          evidence regulators expect for approval.
      - question: |
          A study uses an open-label, non-randomized, single-arm design in a
          small number of participants and is labeled early phase 1. What are the
          practical implications and limitations of reading its results?
        expected_answer: |
          This is an early exploratory study, not a confirmatory one. Early
          phase 1 (and phase 1 generally) prioritizes safety, tolerability, and
          dosing over proving efficacy. A single arm with no randomized control
          and open-label (unmasked) assessment means there is no concurrent
          comparator and a high risk of selection and expectation bias, so any
          apparent benefit cannot be attributed causally to the intervention.
          Practically, its results are hypothesis-generating -- useful for
          deciding whether to advance to larger controlled trials -- rather than
          evidence of effectiveness.
      - question: |
          Why does it matter whether a trial pre-specifies its primary outcome
          measure versus reporting several outcomes after the fact?
        expected_answer: |
          Pre-specifying the primary outcome fixes, before data are seen, the
          single result the trial is powered to detect and judged on. CTO
          separates the primary outcome measurement from other outcome measures
          precisely because this hierarchy guards against outcome-switching and
          multiple-comparison bias: picking the best-looking result after the
          fact inflates false-positive risk. Practically, a trial that meets a
          pre-registered primary outcome provides far more trustworthy evidence
          than one that highlights a favorable secondary or post-hoc outcome.
      - question: |
          A trial record lists a healthy-volunteer eligibility criterion and an
          18-64 age range. What does that tell me about the study?
        expected_answer: |
          It tells you the study recruits healthy enrollees rather than patients
          with the target condition, within a working-age adult band (18-64,
          excluding children and the elderly). Practically this is characteristic
          of an early safety/pharmacokinetic study (typical of phase 1), where
          the goal is to observe how the intervention behaves in people without
          confounding disease, and where excluding pediatric and older
          populations limits variability and risk. It also means the results may
          not generalize to the eventual patient population.
  - name: "CL"
    owl_file: "~/cl.owl"
    questions:
      - question: "What are all the subtypes of 'T cell'?"
        expected_answer: |
           They include helper T cells, cytotoxic T cells, memory T cells, and
           specialized subtypes like alpha-beta T cells, gamma-delta T cells,
           and regulatory T cells.
      - question: "Is a 'Kupffer cell' a type of macrophage?"
        expected_answer: |
          Yes. The Cell Ontology defines a 'Kupffer cell' as a type of
          stellate macrophage, which is a type of macrophage. They include
          helper T cells, cytotoxic T cells, memory T cells, and
          specialized subtypes like alpha-beta T cells, gamma-delta T cells,
          and regulatory T cells.
      - question: "What is the most general classification for a 'neuron'?"
        expected_answer: |
          A neuron is classified as an 'electrically excitable cell' and
          an 'animal cell'.
      - question: "What does a 'hematopoietic stem cell' develop into?"
        expected_answer: |
          it develops into precursors such as multipotent progenitors (MPP),
          common myeloid progenitors (CMP), and common lymphoid progenitors (CLP).
      - question: "Which precursor cell type does a 'mature B cell' derive from?"
        expected_answer: |
          B cell -> Immature B cell -> Pro-B cell -> Pre-B cell, so it develops
          from a 'pre-B cell'.
      - question: "Which cell types express the gene 'CD4' and are listed as a subtype of 'lymphocyte'?"
        expected_answer: |
          'CD4-positive helper T cell' (CL:0000912), 'CD4-positive alpha-beta T
          cell', and certain regulatory T cell subtypes.
      - question: "What is the defining surface marker for a 'pro-B cell'?"
        expected_answer: |
          The presence of markers such as CD19, CD45R, and surface expression
          of MHC class II.
      - question: "List all cell types associated with the 'liver' in the mouse"
        expected_answer: |
          Hepatocytes, hepatic stellate cells, Kupffer cells, and liver
          sinusoidal endothelial cells.

  - name: "HPO"
    owl_file: "~/hp-full.owl"
    questions:
      - question: "What is the official medical definition and primary term for a patient with webbed fingers or toes?"
        expected_answer: |
          Syndactyly. The database defines it as a congenital anomaly
          characterized by the fusion of adjacent digits of the hand or foot.
      - question: "How does the ontology internally resolve the clinical free-text description 'drop in blood pressure'?"
        expected_answer: |
          It maps it to Hypotension. The ontology stores "drop in blood pressure"
          and "low blood pressure" explicitly as exact synonyms under this unique
          alphanumeric identifier.
      - question: "What specific term does the ontology provide for insomnia that occurs at the very end of the sleep cycle?"
        expected_answer: |
          Terminal insomnia.
      - question: "What are the immediate parent terms for 'Arachnodactyly' (abnormally long and slender fingers)?"
        expected_answer: |
          The primary parent is Abnormal finger morphology (HP:0001187), which
          itself branches upward into Abnormal digit morphology (HP:0001151)
          and Abnormal hand morphology (HP:0000117).
      - question: "What broader classifications automatically apply if a patient is diagnosed with 'Terminal insomnia'?"
        expected_answer: |
          If a patient has terminal insomnia, they are structurally cataloged as
          having Insomnia (HP:0100545) and Sleep disturbance (HP:0002360).
      - question: "Does 'Saccular aortic arch aneurysm' share a parent term with 'Thoracic aortic aneurysm'?"
        expected_answer: |
          Yes. Both inherit from Aortic arch aneurysm (HP:0005113).
      - question: "What primary skeletal and cardiovascular abnormalities characterize Marfan syndrome?"
        expected_answer: |
          The database maps Marfan syndrome (OMIM:154700) to over 50 specific
          phenotypic terms, including Aortic aneurysm (HP:0004942) and
          Arachnodactyly (HP:0001166).
      - question: "What is the frequency of the phenotype 'Brachydactyly' (short digits) within Hydrolethalus syndrome?"
        expected_answer: |
          Brachydactyly is rare in this specific disease, documented with an
          explicit baseline ratio of 3/56 cases.
