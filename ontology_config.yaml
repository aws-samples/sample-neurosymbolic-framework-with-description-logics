# owl_file may be one of:
#   - a bare filename (e.g. "fma.owl")      -> resolved under <repo_root>/data/
#   - an absolute / ~ / relative path       -> used as-is
#   - an s3://bucket/key URI                 -> downloaded once to a local cache
#         (~/.cache/ontology-qa, override with ONTOLOGY_QA_CACHE_DIR) and reused
#         across runs. Keeps the large .owl out of local disk / the repo tree.
#         Requires AWS credentials with s3:GetObject on the object.
ontologies:
  - name: "FMA"
    display_name: "Foundational Model of Anatomy"
    owl_file: "s3://neurosymbolicdl-storage-ontologybucket795a3498-gjp5avevev34/ontologies/fma.owl"
    questions:
      - question: "What are the parts of the heart?"
        expected_answer: |
          The human heart is a four-chambered muscular organ comprising the
          right/left atria (upper chambers) and right/left ventricles (lower
          chambers). It includes four valves (tricuspid, pulmonary, mitral, 
          aortic) to control flow, the septum dividing the sides, and major
          vessels like the vena cava and aorta to pump blood.
      - question: "What is the function of the liver?"
        expected_answer: |
          The liver is a vital organ performing over 500 functions, primarily
          filtering toxins from over 250 gallons of blood daily, aiding digestion
          via bile production, and metabolizing nutrients. It regulates blood
          clotting, stores iron and vitamins, and maintains steady blood sugar
          levels. The liver is unique in its ability to regenerate, even if
          90% is removed
      - question: "Which organ system is the uterine tube part of?"
        expected_answer: |
          The uterine tube (or fallopian tube) is part of the female reproductive
          system. These paired tubes connect the ovaries to the uterus, serving
          as the pathway for the egg (ovum) to travel and as the primary site
          for fertilization.
      - question: "What is the smallest part of the small intestine?"
        expected_answer: |
          The smallest part of the small intestine is the duodenum. It is the
          first, shortest, and widest section, measuring approximately 10
          inches in length. in length. The duodenum connects the stomach
          to the jejunum and is C-shaped, wrapping around the head of the
          pancreas.
      - question: "What is the esophagus continuous with superiorly?"
        expected_answer: |
          The esophagus is continuous superiorly with the laryngopharynx
          (or laryngeal part of the pharynx).
      - question: "What is posterior to the esophagus?"
        expected_answer: |
          The primary structure posterior to the esophagus throughout its course
          is the vertebral column (spine), along with the prevertebral fascia and
          muscles. It is also closely related posteriorly to the descending
          thoracic aorta, the thoracic duct, and the azygos vein within the
          thoracic cavity.
      - question: "What surfaces bound the pleural cavity?"
        expected_answer: |
          The pleural cavity is a potential, fluid-filled space bounded by two
          layers of serous membrane, the visceral and parietal pleurae, which
          surround each lung. It is located entirely within the thoracic cavity.
      - question: "What is contained within the middle mediastinum?"
        expected_answer: |
          The middle mediastinum is the central and largest subdivision of the
          inferior mediastinum, primarily defined by the area occupied by the
          heart and its surrounding protective sac.
      - question: "What are the Latin synonyms for the uterine tube?"
        expected_answer: |
          The primary Latin term for the uterine tube is tuba uterina. Key
          synonyms, including Latinized Greek and historical terms, are salpinx
          (often used in plural as salpinges) and tuba Falloppii (or Fallopian
          tube), named after the anatomist Gabriele Falloppio. It is also 
          referred to as oviductus.
      - question: "What does the neural tube develop into?"
        expected_answer: |
          The neural tube is the embryonic precursor to the entire central
          nervous system (CNS), developing into the brain, spinal cord, and
          associated structures.
      - question: "What is the germ layer origin of the kidney?"
        expected_answer: |
          The kidney originates from the intermediate mesoderm. Specifically,
          this mesodermal region forms the urogenital ridge and the nephrogenic
          cord, which sequentially give rise to the pronephros, mesonephros,
          and the final, permanent kidney known as the metanephros.
      - question: "Is blood classified as solid or liquid?"
        expected_answer: |
          Blood is primarily classified as a liquid connective tissue. It is a
          fluid, but it is technically a mixture composed of about 55% liquid
          plasma and 45% solid cellular components (red blood cells, white blood
          cells, and platelets). It is often described as a non-Newtonian fluid,
          acting as a viscous fluid that can exhibit elastic properties.
      - question: "Is the carotid artery part of the circulatory system?"
        expected_answer: |
          Yes, the carotid arteries are a vital part of the circulatory system.
          They are major blood vessels in the neck that supply oxygen-rich
          blood directly to the brain, neck, and face.
      # --- Added to double the FMA eval set (13 -> 26). Each is a distinct
      #     anatomical concept answerable from FMA's class hierarchy and
      #     part-of / continuity / regional relationships. ---
      - question: "How many bones make up the adult human skeleton, and what are its two major divisions?"
        expected_answer: |
          The adult human skeleton comprises 206 bones, organized into two major
          divisions: the axial skeleton (the skull, vertebral column, ribs, and
          sternum, which form the central axis of the body) and the appendicular
          skeleton (the bones of the limbs together with the pectoral and pelvic
          girdles that attach them to the axial skeleton).
      - question: "What are the four lobes of the cerebral cortex?"
        expected_answer: |
          The cerebral cortex is divided into four paired lobes named for the
          overlying cranial bones: the frontal lobe (anterior, concerned with
          movement, planning, and executive function), the parietal lobe
          (somatosensory processing and spatial awareness), the temporal lobe
          (hearing, memory, and language), and the occipital lobe (posterior,
          dedicated to vision).
      - question: "What is the largest artery in the human body, and where does it originate?"
        expected_answer: |
          The aorta is the largest artery in the human body. It originates from
          the left ventricle of the heart at the aortic valve, arches over the
          heart (the aortic arch), then descends through the thorax and abdomen
          (the thoracic and abdominal aorta) before dividing into the common
          iliac arteries.
      - question: "Which structures make up the upper respiratory tract?"
        expected_answer: |
          The upper respiratory tract consists of the nose and nasal cavity, the
          paranasal sinuses, the pharynx (naso-, oro-, and laryngopharynx), and
          the larynx. It conducts and conditions air before it passes into the
          lower respiratory tract (the trachea, bronchi, and lungs).
      - question: "What are the three parts of the small intestine in order?"
        expected_answer: |
          The small intestine has three continuous parts, in order from the
          stomach: the duodenum (the first, C-shaped segment), the jejunum (the
          middle portion), and the ileum (the final segment, which joins the
          large intestine at the ileocecal junction).
      - question: "What muscle is primarily responsible for respiration, and what separates the thoracic and abdominal cavities?"
        expected_answer: |
          The diaphragm is the primary muscle of respiration. It is a dome-shaped
          sheet of skeletal muscle that forms the floor of the thoracic cavity
          and the roof of the abdominal cavity, so it also serves as the anatomic
          partition separating those two cavities.
      - question: "What is the functional unit of the kidney called?"
        expected_answer: |
          The functional unit of the kidney is the nephron. Each kidney contains
          roughly a million nephrons, and each nephron consists of a renal
          corpuscle (glomerulus plus Bowman's capsule) and a renal tubule that
          together filter blood and form urine.
      - question: "Which bones form the pectoral (shoulder) girdle?"
        expected_answer: |
          The pectoral girdle is formed by two paired bones on each side: the
          clavicle (collarbone) and the scapula (shoulder blade). Together they
          connect the upper limb to the axial skeleton and provide attachment for
          the muscles that move the arm.
      - question: "What are the three auditory ossicles of the middle ear?"
        expected_answer: |
          The three auditory ossicles, the smallest bones in the body, are the
          malleus (hammer), the incus (anvil), and the stapes (stirrup). They
          form a chain in the middle ear that transmits and amplifies sound
          vibrations from the tympanic membrane to the oval window of the inner
          ear.
      - question: "What type of joint is the knee, and what bones does it connect?"
        expected_answer: |
          The knee is a synovial hinge joint. It connects the femur (thigh bone)
          above to the tibia (shin bone) below, with the patella (kneecap)
          articulating anteriorly; the fibula lies lateral but does not form part
          of the main femorotibial articulation.
      - question: "What is the outermost layer of the skin, and what tissue type is it?"
        expected_answer: |
          The outermost layer of the skin is the epidermis, which is composed of
          keratinized stratified squamous epithelium. It overlies the dermis
          (dense connective tissue) and provides a protective, waterproof barrier.
      - question: "Which quadrant of the abdomen contains the appendix?"
        expected_answer: |
          The appendix (vermiform appendix) is located in the right lower
          quadrant of the abdomen. It is a blind-ending tube attached to the
          cecum, the first part of the large intestine, near the ileocecal
          junction.
      - question: "What are the chambers of the heart that receive blood, and from where?"
        expected_answer: |
          The two atria are the receiving chambers of the heart. The right atrium
          receives deoxygenated blood returning from the body via the superior
          and inferior vena cavae, while the left atrium receives oxygenated blood
          returning from the lungs via the pulmonary veins.
  - name: "GO"
    display_name: "Gene Ontology"
    owl_file: "s3://neurosymbolicdl-storage-ontologybucket795a3498-gjp5avevev34/ontologies/go-plus.owl"
    # The GO eval set has TWO complementary kinds of question so the evolved
    # program stays competent at BOTH:
    #   (a) factual single-gene annotation lookups, and
    #   (b) interpretive "practical meaning" of an experimental finding
    #       (typically a GO enrichment result).
    # Every expected_answer stays grounded in retrievable GO facts (annotations,
    # the enriched term's definition / parent process / child terms) and then
    # interprets them, so the neurosymbolic retrieval still drives the answer
    # rather than free speculation.
    questions:
      # --- (a) Factual single-gene annotation lookups ---
      - question: "Does TP53 interact with DNA?"
        expected_answer: |
          Yes, it has DNA-binding transcription factor activity.
      - question: "What happens when TP53 is active?"
        expected_answer: |
          It coordinates the apoptotic process (programmed cell death) and
          cell cycle arrest.
      - question: "Where does TP53 go to do its job?"
        expected_answer: |
          It is primarily found in the nucleus and cytoplasm, but can also
          relocate to the mitochondria during stress.
      - question: "What is BRCA1's main role in the cell?"
        expected_answer: |
          Its primary process is DNA repair, specifically repairing
          double-strand breaks.
      - question: "How does BRCA1 physically perform that repair?"
        expected_answer: |
          It exhibits ubiquitin-protein transferase activity,
          helping to flag other proteins for the repair process.
      - question: "Where is BRCA1 located during a 'crisis'?"
        expected_answer: |
          It localizes to nuclear replication forks and sites of DNA damage.
      - question: "What kind of receptor is EGFR?"
        expected_answer: |
          It has transmembrane receptor protein tyrosine kinase activity.
      - question: "Where is EGFR positioned to catch signals?"
        expected_answer: |
          It is anchored in the plasma membrane, with parts projecting
          outside the cell to "catch" growth factors.

      # --- (b) Interpretive "practical meaning" questions ---
      - question: |
          In a transcriptomic study of drug-resistant cancer cells, a scientist
          identifies 200 significantly upregulated genes. A GO enrichment
          analysis reveals a statistically significant enrichment for the term
          "microtubule cytoskeleton organization". What does this result mean
          practically?
        expected_answer: |
          Practically, it means the drug-resistant cells are preferentially
          turning up genes that build and reorganize the microtubule
          cytoskeleton. "Microtubule cytoskeleton organization" is the
          biological process of assembling and arranging microtubule-based
          structures, so enrichment implies these cells are investing in
          spindle formation, intracellular transport, and cell-shape/division
          machinery. Because microtubules are the target of taxanes and vinca
          alkaloids, this is a plausible resistance mechanism: the cells may be
          compensating for microtubule-targeting chemotherapy. The actionable
          read is that microtubule dynamics are a candidate driver of the
          resistant phenotype and a lead for follow-up.
      - question: |
          A GO enrichment analysis of genes upregulated after a viral infection
          shows strong enrichment for "defense response to virus". How should I
          interpret this biologically?
        expected_answer: |
          It means the up-regulated gene set is dominated by genes whose role is
          mounting an antiviral defense. "Defense response to virus" is the
          biological process of reacting to a virus to limit its replication or
          spread, so enrichment indicates the cells have switched on an
          antiviral program (interferon-stimulated and innate-immune effectors).
          Practically, the sample is responding as expected to infection, and
          the enriched term points you toward the immune-defense arm rather than,
          say, metabolism or proliferation.
      - question: |
          My differentially expressed genes are enriched for "oxidative
          phosphorylation". What does an enrichment for this process practically
          tell me about the cells?
        expected_answer: |
          Oxidative phosphorylation is the mitochondrial process that generates
          ATP by transferring electrons through the respiratory chain, so
          enrichment practically indicates a shift in the cells' energy
          metabolism toward mitochondrial ATP production. It suggests increased
          reliance on aerobic respiration rather than glycolysis, which can
          reflect higher energy demand or a metabolic reprogramming. The
          actionable interpretation is that mitochondrial/respiratory function
          is a distinguishing feature of this condition.
      - question: |
          A gene of interest is annotated with the cellular component
          "extracellular space". What does that localization practically imply
          about the protein's function?
        expected_answer: |
          Localization to the extracellular space practically implies the
          protein is secreted and acts outside the cell. That constrains its
          likely functions to things that happen externally: signaling to other
          cells, remodeling the extracellular matrix, or acting as a ligand,
          enzyme, or structural component in the surrounding environment. It
          also makes the protein a more accessible drug or biomarker target,
          since it is not sequestered inside the cell.
      - question: |
          Enrichment analysis of a tumor sample highlights "cell cycle" and
          "DNA replication". Practically, what does the co-enrichment of these
          processes suggest?
        expected_answer: |
          Together these point to actively proliferating cells. "Cell cycle" is
          the process controlling cell division and "DNA replication" is the
          copying of the genome that must precede each division, so
          co-enrichment practically means the sample is dominated by dividing
          cells synthesizing DNA. In a tumor context this is consistent with a
          high proliferative index and aggressive growth, and it flags
          cell-cycle/replication machinery as candidate therapeutic targets.
      - question: |
          Downregulated genes in a neurodegeneration model are enriched for
          "synaptic signaling". What is the practical significance of losing
          expression in this process?
        expected_answer: |
          "Synaptic signaling" is the process of transmitting signals across
          synapses between neurons, so losing expression there practically means
          the neurons' ability to communicate is being degraded. In a
          neurodegeneration model this suggests synaptic dysfunction and loss of
          connectivity as a mechanism of the disease phenotype, and it points to
          synaptic maintenance as a process to protect or restore.
      - question: |
          A screen returns enrichment for "response to oxidative stress".
          Practically, what state are these cells likely in?
        expected_answer: |
          "Response to oxidative stress" is the process cells use to counter
          damage from reactive oxygen species, so its enrichment practically
          indicates the cells are experiencing or defending against oxidative
          stress. They are likely upregulating antioxidant and damage-repair
          machinery, which signals an underlying stressful or damaging
          condition rather than a resting steady state.
      - question: |
          If a set of upregulated genes is enriched for "angiogenesis" in a
          tumor biopsy, what does that practically indicate about the tumor?
        expected_answer: |
          Angiogenesis is the process of forming new blood vessels, so
          enrichment practically indicates the tumor is driving new vessel
          growth to supply itself with oxygen and nutrients. This is a hallmark
          of growing, more aggressive tumors and flags the angiogenic program
          (e.g. VEGF-driven signaling) as a therapeutically targetable
          vulnerability.
      - question: |
          Enrichment analysis shows "inflammatory response" is significantly
          over-represented in a wound-healing time course. How do I read this
          practically?
        expected_answer: |
          "Inflammatory response" is the process of reacting to harmful stimuli
          or injury, so its over-representation in a wound-healing course
          practically means the inflammatory phase of healing is active in these
          samples. It indicates immune cells and signaling are engaged to clear
          damage and initiate repair, which is the expected early stage of
          wound healing rather than an abnormal finding.
      - question: |
          A GO term enriched in my dataset is "protein folding". Practically,
          what cellular situation does enrichment for this process most likely
          reflect?
        expected_answer: |
          "Protein folding" is the process of giving proteins their functional
          three-dimensional shape, often assisted by chaperones. Enrichment
          practically reflects increased demand for folding capacity, typically
          because the cells are under proteotoxic or ER stress, synthesizing
          large amounts of protein, or coping with misfolded proteins. The
          practical read is a stressed proteostasis state engaging the
          chaperone/quality-control machinery.

      # === Added to double the GO eval set (18 -> 36), preserving the
      #     factual / interpretive balance (8 new factual + 10 new interpretive).
      #     New genes and GO terms, grounded in GO annotations and term
      #     definitions, deeply distinct from the existing items. ===

      # --- (a) Factual single-gene annotation lookups (new) ---
      - question: "What is the molecular function of the gene MYH7?"
        expected_answer: |
          MYH7 encodes a myosin heavy chain with motor activity; it has ATPase
          activity and actin binding, driving muscle contraction in cardiac and
          slow-twitch skeletal muscle.
      - question: "In which cellular component does the ribosomal protein RPL13 act?"
        expected_answer: |
          It is a structural constituent of the ribosome and is located in the
          large (60S) ribosomal subunit in the cytoplasm, where it participates
          in translation.
      - question: "What biological process is the gene CASP3 central to?"
        expected_answer: |
          CASP3 is an executioner caspase central to the apoptotic process
          (programmed cell death); it has cysteine-type endopeptidase activity
          and cleaves many cellular substrates during apoptosis.
      - question: "What kind of activity does the enzyme SOD1 have?"
        expected_answer: |
          SOD1 has superoxide dismutase activity: it catalyzes the conversion of
          superoxide radicals into oxygen and hydrogen peroxide, functioning in
          the cellular response to oxidative stress, primarily in the cytoplasm.
      - question: "Where in the cell does the protein LMNA (lamin A/C) localize?"
        expected_answer: |
          LMNA localizes to the nuclear envelope, specifically the nuclear
          lamina on the inner side of the inner nuclear membrane, where it
          provides structural support to the nucleus as a structural molecule.
      - question: "What is the primary molecular function of the gene HBB?"
        expected_answer: |
          HBB encodes beta-globin; its molecular function is oxygen binding (and
          heme binding), and it participates in the biological process of oxygen
          transport as part of the hemoglobin complex.
      - question: "What process does the gene ATG7 participate in?"
        expected_answer: |
          ATG7 participates in autophagy (specifically macroautophagy); it acts
          as an E1-like activating enzyme that is required for forming the
          autophagosome membrane.
      - question: "What is the molecular function and location of the gene SLC2A1 (GLUT1)?"
        expected_answer: |
          SLC2A1/GLUT1 has glucose transmembrane transporter activity and is
          located in the plasma membrane, where it mediates facilitated glucose
          transport into the cell.

      # --- (b) Interpretive "practical meaning" questions (new) ---
      - question: |
          A GO enrichment analysis of genes upregulated during stem-cell
          differentiation shows strong enrichment for "cell differentiation" and
          "developmental process". How should I interpret this biologically?
        expected_answer: |
          "Cell differentiation" is the process by which a less specialized cell
          becomes more specialized, and "developmental process" is the broader
          category of processes that advance an organism or cell toward its mature
          state. Co-enrichment practically confirms the cells are executing a
          differentiation program -- turning on the gene sets that drive
          commitment toward a specialized fate rather than maintaining a
          proliferative, undifferentiated state. The actionable read is that the
          sample is progressing along a lineage, so lineage-specification genes
          are the drivers to examine next.
      - question: |
          Enrichment analysis of a dataset from senescent cells highlights
          "cellular senescence" and "negative regulation of cell cycle". What
          does this co-enrichment practically indicate?
        expected_answer: |
          "Cellular senescence" is the process of a stable, essentially permanent
          cell-cycle arrest in response to stress or damage, and "negative
          regulation of cell cycle" captures the braking of division. Together
          they practically indicate the cells have exited active proliferation and
          entered a senescent state -- not dead, but no longer dividing. In
          context this flags growth arrest (often with an inflammatory secretory
          phenotype) rather than apoptosis, pointing to senescence as the dominant
          response rather than cell death or continued growth.
      - question: |
          My upregulated genes are enriched for "autophagy". Practically, what
          cellular situation does enrichment for this process most likely reflect?
        expected_answer: |
          Autophagy is the regulated process of degrading and recycling the
          cell's own components by delivering them to the lysosome. Enrichment
          practically reflects that the cells are increasing self-digestion and
          recycling, typically in response to nutrient deprivation, stress, or a
          need to clear damaged organelles and protein aggregates. The practical
          read is a cell adapting to starvation or stress by recycling internal
          resources to survive, rather than one in a nutrient-replete growth state.
      - question: |
          A GO enrichment of genes downregulated after a toxin exposure shows
          enrichment for "mitochondrial electron transport chain". What is the
          practical significance of losing expression in this process?
        expected_answer: |
          The mitochondrial electron transport chain is the set of complexes that
          pass electrons to generate the proton gradient driving ATP synthesis.
          Losing expression there practically means the cells' capacity for
          mitochondrial energy production is being impaired -- a sign of
          mitochondrial dysfunction and compromised aerobic ATP generation. In a
          toxin-exposure context this points to the toxin damaging respiratory
          capacity, which can force a shift toward glycolysis and signal energetic
          stress.
      - question: |
          Enrichment analysis shows "immune response" and "cytokine-mediated
          signaling pathway" are over-represented in a chronic-inflammation
          sample. How do I read this practically?
        expected_answer: |
          "Immune response" is the body's reaction to defend against a perceived
          threat, and "cytokine-mediated signaling pathway" is the process of
          cells communicating via cytokines to coordinate that response.
          Over-representation of both practically means the sample is dominated by
          active immune signaling -- cells are producing and responding to
          cytokines to sustain an inflammatory/immune program. In a chronic
          context this indicates persistent immune activation rather than a
          resolved or resting state, pointing at cytokine signaling as a driver to
          target.
      - question: |
          A GO term enriched among genes upregulated in a fibrotic tissue is
          "extracellular matrix organization". Practically, what does this tell me
          about the tissue?
        expected_answer: |
          "Extracellular matrix organization" is the process of assembling and
          arranging the network of proteins outside cells. Enrichment practically
          indicates the tissue is actively building and remodeling its
          extracellular matrix -- depositing collagen and related structural
          proteins. In a fibrotic context this is the molecular signature of
          scarring/fibrosis, so the actionable interpretation is excessive matrix
          deposition driving tissue stiffening, and ECM-remodeling pathways as a
          therapeutic target.
      - question: |
          A screen of genes upregulated in dividing cells returns enrichment for
          "chromosome segregation". Practically, what stage or activity does this
          point to?
        expected_answer: |
          "Chromosome segregation" is the process of partitioning replicated
          chromosomes to opposite poles so each daughter cell receives a complete
          set. Enrichment practically points to cells engaged in mitosis,
          specifically the segregation machinery that operates during anaphase.
          It confirms active division and flags the spindle and segregation
          apparatus as central to the sample's phenotype -- consistent with a
          highly proliferative population.
      - question: |
          Downregulated genes in a model of cardiac failure are enriched for
          "muscle contraction". What is the practical significance of reduced
          expression in this process?
        expected_answer: |
          "Muscle contraction" is the process of generating force and shortening
          via the contractile apparatus. Reduced expression practically means the
          tissue's contractile capacity is being diminished -- the molecular
          machinery that produces force is being downregulated. In a cardiac
          failure model this is consistent with impaired pumping function and
          points to loss of contractile gene expression as a mechanism of the
          functional decline.
      - question: |
          Enrichment analysis of a neuronal dataset highlights "axon guidance".
          Practically, what developmental or regenerative activity does this
          suggest?
        expected_answer: |
          "Axon guidance" is the process directing a growing axon's growth cone
          toward its correct target using attractive and repulsive cues.
          Enrichment practically suggests the neurons are actively extending and
          steering axons -- an activity characteristic of neural development or
          of regeneration/rewiring after injury. The actionable read is that the
          sample is engaged in establishing or re-establishing neuronal
          connectivity, so guidance-cue signaling is the relevant program.
      - question: |
          A GO enrichment of a hypoxic tumor sample shows "response to hypoxia"
          and "glycolytic process". Practically, what metabolic state does this
          co-enrichment describe?
        expected_answer: |
          "Response to hypoxia" is the process of reacting to low oxygen, and the
          "glycolytic process" is the breakdown of glucose to pyruvate for energy
          without requiring oxygen. Co-enrichment practically describes cells
          adapting to a low-oxygen environment by shifting their energy
          production toward glycolysis -- the classic hypoxic/Warburg-like
          metabolic switch. In a tumor context it indicates the cells are
          surviving oxygen scarcity by relying on anaerobic ATP production, which
          flags HIF-driven and glycolytic pathways as features of the aggressive,
          hypoxic phenotype.

  - name: "CTO"
    display_name: "Clinical Trial Ontology"
    owl_file: "s3://neurosymbolicdl-storage-ontologybucket795a3498-gjp5avevev34/ontologies/cto.owl"
    # Clinical Trial Ontology (CTO, OBO Foundry / BFO-based). The eval set has
    # two complementary kinds of question so the evolved program stays competent
    # at BOTH:
    #   (a) factual lookups of trial-design concepts CTO actually defines
    #       (phases, masking/blinding, allocation, eligibility, outcomes,
    #       registries), and
    #   (b) interpretive "what does this trial design mean / imply" questions.
    # Every expected_answer stays grounded in CTO's real class hierarchy and
    # definitions so the neurosymbolic retrieval drives the answer rather than
    # free speculation.
    questions:
      # --- (a) Factual trial-design concept lookups ---
      - question: "What clinical trial phases does the ontology define?"
        expected_answer: |
          The Clinical Trial Ontology defines the trial-phase concepts: early
          phase 1, phase 1, phase 1/2, phase 2, phase 2/3, phase 3, phase 4,
          and "phase not applicable" (for trials, such as many device or
          behavioral studies, where the drug-development phase model does not
          apply). These are subclasses of "clinical trial phase".
      - question: "What is a phase 1 clinical trial?"
        expected_answer: |
          A phase 1 clinical trial is the earliest human-testing phase, focused
          on evaluating the safety, tolerability, and pharmacokinetics of an
          intervention in a small group of participants, and on identifying
          side effects and a safe dosage range rather than proving efficacy.
      - question: "What kinds of masking (blinding) design does CTO describe?"
        expected_answer: |
          CTO represents masking design concepts including a double blinded
          design (neither the participants nor the investigators know the
          treatment assignment) and an open (open-label) design (the assignment
          is known to both). Masking design is how a trial controls for bias in
          how outcomes are reported and assessed.
      - question: "What is the difference between random and non-random allocation in a trial?"
        expected_answer: |
          Allocation is how participants are assigned to study arms. CTO
          distinguishes random allocation -- assignment by chance, which balances
          known and unknown confounders across arms and underpins causal
          inference -- from non-random allocation, where assignment follows a
          non-chance rule and is more susceptible to selection bias.
      - question: "What eligibility criteria concepts does the ontology represent?"
        expected_answer: |
          CTO represents eligibility concepts such as age-range criteria
          (birth-17 years, 18-64 years, older than 64), a healthy-volunteer
          criterion, and the notion of a healthy enrollee versus an enrolled
          patient. These define who may be recruited into a trial.
      - question: "What is a primary outcome measure?"
        expected_answer: |
          A primary outcome measure is the pre-specified result the trial is
          principally designed and powered to detect. CTO models primary outcome
          measure information and primary outcome measurement (with its outcome
          measurement datum) separately from other/secondary outcome measures,
          because the primary outcome is what the trial's success is judged on.
      - question: "What is a clinical trial sponsor role?"
        expected_answer: |
          The clinical trial sponsor role is the role borne by the organization
          or individual that takes responsibility for initiating, managing, and
          financing a clinical trial. In CTO it is a role (a realizable entity)
          rather than the organization itself.
      - question: "Name some clinical trial registries the ontology knows about."
        expected_answer: |
          CTO catalogs numerous national and regional trial registries, each with
          its identifier concept, including ClinicalTrials.gov, the EU Clinical
          Trials Register, the German clinical trials register, the Chinese,
          Indian, Japanese (JAPIC/JMACCT/jRCT), Korean, Iranian, Brazilian,
          Cuban, Peruvian, Lebanese, Pan African, and Australian New Zealand
          clinical trial registries, plus the ISRCTN register.

      # --- (b) Interpretive "what does this design imply" questions ---
      - question: |
          A trial is registered as a randomized, double-blind, placebo-controlled
          phase 3 study. What does that design mean practically, and what is it
          able to establish?
        expected_answer: |
          Practically this is a late-stage confirmatory efficacy trial. Phase 3
          means it tests the intervention in a large participant population to
          confirm effectiveness and monitor adverse reactions after safety was
          established earlier. Randomized allocation distributes known and unknown
          confounders evenly across arms, and double blinding keeps both
          participants and investigators unaware of assignment, controlling
          placebo effects and assessment bias. Placebo control gives the
          comparison baseline. Together these make it the strongest ordinary
          design for establishing a causal efficacy claim -- the kind of pivotal
          evidence regulators expect for approval.
      - question: |
          A study uses an open-label, non-randomized, single-arm design in a
          small number of participants and is labeled early phase 1. What are the
          practical implications and limitations of reading its results?
        expected_answer: |
          This is an early exploratory study, not a confirmatory one. Early
          phase 1 (and phase 1 generally) prioritizes safety, tolerability, and
          dosing over proving efficacy. A single arm with no randomized control
          and open-label (unmasked) assessment means there is no concurrent
          comparator and a high risk of selection and expectation bias, so any
          apparent benefit cannot be attributed causally to the intervention.
          Practically, its results are hypothesis-generating -- useful for
          deciding whether to advance to larger controlled trials -- rather than
          evidence of effectiveness.
      - question: |
          Why does it matter whether a trial pre-specifies its primary outcome
          measure versus reporting several outcomes after the fact?
        expected_answer: |
          Pre-specifying the primary outcome fixes, before data are seen, the
          single result the trial is powered to detect and judged on. CTO
          separates the primary outcome measurement from other outcome measures
          precisely because this hierarchy guards against outcome-switching and
          multiple-comparison bias: picking the best-looking result after the
          fact inflates false-positive risk. Practically, a trial that meets a
          pre-registered primary outcome provides far more trustworthy evidence
          than one that highlights a favorable secondary or post-hoc outcome.
      - question: |
          A trial record lists a healthy-volunteer eligibility criterion and an
          18-64 age range. What does that tell me about the study?
        expected_answer: |
          It tells you the study recruits healthy enrollees rather than patients
          with the target condition, within a working-age adult band (18-64,
          excluding children and the elderly). Practically this is characteristic
          of an early safety/pharmacokinetic study (typical of phase 1), where
          the goal is to observe how the intervention behaves in people without
          confounding disease, and where excluding pediatric and older
          populations limits variability and risk. It also means the results may
          not generalize to the eventual patient population.
      # === Added to double the CTO eval set (12 -> 24), preserving the
      #     factual / interpretive balance (8 new factual + 4 new interpretive).
      #     Distinct trial-design concepts grounded in CTO's class hierarchy. ===

      # --- (a) Factual trial-design concept lookups (new) ---
      - question: "What is a placebo-controlled design in CTO?"
        expected_answer: |
          A placebo-controlled design is a comparator-arm design in which the
          control group receives a placebo -- an inactive substance made to
          resemble the active intervention -- so that the intervention's effect
          can be measured against a baseline that accounts for the placebo effect.
          CTO represents it among its control/comparator design concepts.
      - question: "What is a crossover design in a clinical trial?"
        expected_answer: |
          In a crossover design each participant receives more than one of the
          study treatments in sequence, serving as their own control across
          successive periods (often with a washout between them). CTO models it
          as an intervention-model/assignment design distinct from a
          parallel-group design, where each participant stays on a single arm.
      - question: "What is a parallel-group (parallel assignment) design?"
        expected_answer: |
          A parallel-group design assigns each participant to a single study arm
          for the duration of the trial, with the arms running concurrently and
          compared against each other. CTO represents it as an intervention
          (assignment) model, contrasted with crossover and single-group designs.
      - question: "What does CTO represent as an 'arm' of a clinical trial?"
        expected_answer: |
          In CTO an arm is a group of participants in a trial that receives a
          specific intervention (or no intervention) according to the protocol.
          Trials are structured into one or more arms -- e.g. an experimental
          (treatment) arm and a control arm -- which define the comparison the
          study makes.
      - question: "What is informed consent in the context of CTO?"
        expected_answer: |
          Informed consent is the process (and the resulting documented
          agreement) by which a potential participant, after being told the
          trial's purpose, procedures, risks, and benefits, voluntarily agrees to
          take part. CTO represents it as part of the ethical/enrollment framework
          that must precede a participant's entry into a study.
      - question: "What is a single-group (single-arm) assignment in CTO?"
        expected_answer: |
          A single-group assignment is an intervention model in which all
          enrolled participants receive the same intervention, with no separate
          comparator arm. CTO models it alongside parallel and crossover
          assignments; because there is no concurrent control, such studies are
          typically early-phase or exploratory.
      - question: "What is an interventional study versus an observational study in CTO?"
        expected_answer: |
          CTO distinguishes study types by whether the investigator assigns the
          intervention. In an interventional (experimental) study, participants
          are assigned to receive an intervention per the protocol so its effects
          can be evaluated. In an observational study, participants are observed
          and outcomes recorded without the investigator assigning the
          intervention. These are top-level study-design distinctions in CTO.
      - question: "What is a secondary outcome measure, and how does CTO relate it to the primary outcome?"
        expected_answer: |
          A secondary outcome measure is a pre-specified result of interest that
          the trial is not principally powered to detect, used to assess
          additional effects beyond the main question. CTO models secondary (and
          other) outcome measures separately from the primary outcome measure,
          which remains the result the trial's success is judged on; secondary
          outcomes provide supporting, hypothesis-generating evidence.

      # --- (b) Interpretive "what does this design imply" questions (new) ---
      - question: |
          A trial uses a crossover design with a washout period between
          treatments. What does that design mean practically, and what is its
          main advantage and risk?
        expected_answer: |
          Practically, each participant receives both treatments in sequence and
          acts as their own control, with the washout period letting the first
          treatment clear before the second begins. The main advantage is
          statistical efficiency and control of between-person variability --
          comparing a treatment to itself within the same person needs fewer
          participants. The main risks are carryover effects (an inadequate
          washout lets the first treatment's effect bleed into the second period)
          and period/order effects, so crossover suits stable, chronic conditions
          with reversible, short-acting treatments rather than curative ones.
      - question: |
          A study is observational rather than interventional. Based on CTO's
          distinction, what can and cannot such a study establish?
        expected_answer: |
          Because the investigator does not assign the intervention, an
          observational study can establish associations -- that an exposure and
          an outcome tend to occur together -- and describe real-world patterns,
          but it cannot by itself establish causation. Without randomized
          assignment, confounding factors may explain any observed link.
          Practically, it is well suited to generating hypotheses, studying
          natural history, or examining questions that cannot ethically be
          randomized, while interventional trials remain necessary to prove that
          the intervention causes the effect.
      - question: |
          A trial is single-arm and open-label but enrolls a large number of
          patients with the target disease. Why does the lack of a control arm
          still limit the strength of its conclusions?
        expected_answer: |
          Even with many participants, a single arm has no concurrent comparator,
          so there is nothing to attribute outcomes against: improvement could be
          due to the natural course of the disease, regression to the mean, or
          the placebo/expectation effect rather than the intervention. Open-label
          assessment adds expectation bias on top. Practically, large size
          improves precision of the estimate within the arm but cannot substitute
          for a control group, so the study still cannot causally attribute
          benefit to the treatment -- it remains supportive rather than
          confirmatory evidence.
      - question: |
          A trial reports meeting a secondary outcome but missing its primary
          outcome. Using CTO's separation of outcome types, how should that result
          be interpreted?
        expected_answer: |
          CTO treats the primary outcome as the pre-specified result the trial is
          powered and judged on, with secondary outcomes as supporting measures.
          Practically, missing the primary outcome means the trial did not
          demonstrate its principal hypothesis, so it is formally a negative
          result regardless of the secondary finding. A positive secondary
          outcome is hypothesis-generating -- it may motivate a new trial powered
          specifically for it -- but because it was not the pre-registered basis
          for success, it is subject to multiple-comparison bias and cannot be
          treated as confirmatory evidence on its own.
  - name: "CL"
    display_name: "Cell Ontology"
    owl_file: "s3://neurosymbolicdl-storage-ontologybucket795a3498-gjp5avevev34/ontologies/cl.owl"
    questions:
      - question: "What are all the subtypes of 'T cell'?"
        expected_answer: |
           They include helper T cells, cytotoxic T cells, memory T cells, and
           specialized subtypes like alpha-beta T cells, gamma-delta T cells,
           and regulatory T cells.
      - question: "Is a 'Kupffer cell' a type of macrophage?"
        expected_answer: |
          Yes. The Cell Ontology defines a 'Kupffer cell' as a type of
          stellate macrophage, which is a type of macrophage. They include
          helper T cells, cytotoxic T cells, memory T cells, and
          specialized subtypes like alpha-beta T cells, gamma-delta T cells,
          and regulatory T cells.
      - question: "What is the most general classification for a 'neuron'?"
        expected_answer: |
          A neuron is classified as an 'electrically excitable cell' and
          an 'animal cell'.
      - question: "What does a 'hematopoietic stem cell' develop into?"
        expected_answer: |
          it develops into precursors such as multipotent progenitors (MPP),
          common myeloid progenitors (CMP), and common lymphoid progenitors (CLP).
      - question: "Which precursor cell type does a 'mature B cell' derive from?"
        expected_answer: |
          B cell -> Immature B cell -> Pro-B cell -> Pre-B cell, so it develops
          from a 'pre-B cell'.
      - question: "Which cell types express the gene 'CD4' and are listed as a subtype of 'lymphocyte'?"
        expected_answer: |
          'CD4-positive helper T cell' (CL:0000912), 'CD4-positive alpha-beta T
          cell', and certain regulatory T cell subtypes.
      - question: "What is the defining surface marker for a 'pro-B cell'?"
        expected_answer: |
          The presence of markers such as CD19, CD45R, and surface expression
          of MHC class II.
      - question: "List all cell types associated with the 'liver' in the mouse"
        expected_answer: |
          Hepatocytes, hepatic stellate cells, Kupffer cells, and liver
          sinusoidal endothelial cells.
      # --- Added to double the CL eval set (8 -> 16). Distinct cell-type
      #     classifications, lineage relationships, and markers answerable from
      #     the Cell Ontology's class hierarchy. ---
      - question: "What are the main types of glial cell in the central nervous system?"
        expected_answer: |
          The Cell Ontology classifies the central nervous system glia as
          astrocytes, oligodendrocytes, and microglial cells (with ependymal
          cells also often grouped as CNS glia). Astrocytes provide support and
          regulate the environment, oligodendrocytes myelinate CNS axons, and
          microglia are the resident immune cells of the CNS.
      - question: "Is a 'natural killer cell' a type of lymphocyte?"
        expected_answer: |
          Yes. The Cell Ontology defines a natural killer (NK) cell as a type of
          lymphocyte -- specifically an innate lymphoid cell of the lymphoid
          lineage -- that mediates cytotoxicity without prior antigen
          sensitization.
      - question: "What is the mature, antibody-secreting cell that a B cell differentiates into?"
        expected_answer: |
          A B cell differentiates into a plasma cell (plasmacyte), the terminally
          differentiated, antibody-secreting effector cell of the B-cell lineage.
          The Cell Ontology places the plasma cell downstream of the activated/
          mature B cell.
      - question: "What is the most general classification for an 'erythrocyte' (red blood cell)?"
        expected_answer: |
          The Cell Ontology classifies an erythrocyte as a myeloid cell and, more
          broadly, a hematopoietic cell / blood cell; it is an enucleate,
          oxygen-carrying cell of the erythroid lineage derived ultimately from a
          hematopoietic stem cell.
      - question: "Which myeloid precursor do granulocytes such as neutrophils develop from?"
        expected_answer: |
          Granulocytes (neutrophils, eosinophils, basophils) develop from the
          common myeloid progenitor via the granulocyte-monocyte progenitor
          (GMP), per the Cell Ontology's hematopoietic lineage.
      - question: "Is a 'dendritic cell' considered a professional antigen-presenting cell in the ontology?"
        expected_answer: |
          Yes. The Cell Ontology classifies the dendritic cell as a professional
          antigen-presenting cell of the immune system (myeloid or plasmacytoid
          subtypes), specialized for capturing antigen and presenting it to T
          cells.
      - question: "What type of cell is a 'cardiomyocyte', and what broader class does it belong to?"
        expected_answer: |
          A cardiomyocyte (cardiac muscle cell) is a type of striated muscle cell
          and, more broadly, a muscle cell and an electrically excitable cell in
          the Cell Ontology; it is the contractile cell of the heart.
      - question: "What is the defining role of an 'epithelial cell' and one example subtype?"
        expected_answer: |
          The Cell Ontology defines an epithelial cell as a cell that is part of
          an epithelium -- a sheet of cells covering a surface or lining a cavity,
          typically polarized and joined by cell junctions. An example subtype is
          the keratinocyte (an epidermal epithelial cell).

  - name: "HPO"
    display_name: "Human Phenotype Ontology"
    owl_file: "s3://neurosymbolicdl-storage-ontologybucket795a3498-gjp5avevev34/ontologies/hp-full.owl"
    questions:
      - question: "What is the official medical definition and primary term for a patient with webbed fingers or toes?"
        expected_answer: |
          Syndactyly. The database defines it as a congenital anomaly
          characterized by the fusion of adjacent digits of the hand or foot.
      - question: "How does the ontology internally resolve the clinical free-text description 'drop in blood pressure'?"
        expected_answer: |
          It maps it to Hypotension. The ontology stores "drop in blood pressure"
          and "low blood pressure" explicitly as exact synonyms under this unique
          alphanumeric identifier.
      - question: "What specific term does the ontology provide for insomnia that occurs at the very end of the sleep cycle?"
        expected_answer: |
          Terminal insomnia.
      - question: "What are the immediate parent terms for 'Arachnodactyly' (abnormally long and slender fingers)?"
        expected_answer: |
          The primary parent is Abnormal finger morphology (HP:0001187), which
          itself branches upward into Abnormal digit morphology (HP:0001151)
          and Abnormal hand morphology (HP:0000117).
      - question: "What broader classifications automatically apply if a patient is diagnosed with 'Terminal insomnia'?"
        expected_answer: |
          If a patient has terminal insomnia, they are structurally cataloged as
          having Insomnia (HP:0100545) and Sleep disturbance (HP:0002360).
      - question: "Does 'Saccular aortic arch aneurysm' share a parent term with 'Thoracic aortic aneurysm'?"
        expected_answer: |
          Yes. Both inherit from Aortic arch aneurysm (HP:0005113).
      - question: "What primary skeletal and cardiovascular abnormalities characterize Marfan syndrome?"
        expected_answer: |
          The database maps Marfan syndrome (OMIM:154700) to over 50 specific
          phenotypic terms, including Aortic aneurysm (HP:0004942) and
          Arachnodactyly (HP:0001166).
      - question: "What is the frequency of the phenotype 'Brachydactyly' (short digits) within Hydrolethalus syndrome?"
        expected_answer: |
          Brachydactyly is rare in this specific disease, documented with an
          explicit baseline ratio of 3/56 cases.
      # --- Added to double the HPO eval set (8 -> 16). Distinct phenotype
      #     terms, synonym resolution, hierarchy, and definitions answerable
      #     from the Human Phenotype Ontology. ---
      - question: "What is the primary HPO term for an abnormally small head, and how is it defined?"
        expected_answer: |
          The term is Microcephaly (HP:0000252), defined as a head circumference
          more than two standard deviations below the age- and sex-matched mean
          (occipitofrontal circumference). It falls under abnormalities of head
          size/skull morphology in the ontology.
      - question: "To what single HPO term does the free-text description 'high blood sugar' resolve?"
        expected_answer: |
          It resolves to Hyperglycemia (HP:0003074). The ontology stores lay
          phrases such as "high blood sugar" and "elevated blood glucose" as
          synonyms mapping to this term, a subtype of abnormal glucose
          homeostasis.
      - question: "What is the HPO term for an abnormally increased muscle tone, and what is its opposite term?"
        expected_answer: |
          Increased muscle tone is Hypertonia (HP:0001276); its opposite is
          Hypotonia (HP:0001252), decreased muscle tone. Both are children of
          Abnormality of muscle tone (HP:0003808) in the ontology.
      - question: "What are the immediate parent terms for 'Seizure' in the HPO?"
        expected_answer: |
          Seizure (HP:0001250) sits under Abnormality of the nervous system,
          specifically within abnormal nervous system physiology / abnormal
          CNS electrophysiology; it is itself the parent of many seizure-type
          subclasses (focal, generalized, etc.).
      - question: "What HPO term describes an unusually tall stature, and how is it quantified?"
        expected_answer: |
          Tall stature (HP:0000098), defined as a height more than two standard
          deviations above the mean for age and sex. It is the counterpart of
          Short stature (HP:0004322) under abnormalities of body height.
      - question: "What is the HPO term and definition for yellowing of the skin and eyes?"
        expected_answer: |
          Jaundice (HP:0000952), defined as yellow discoloration of the skin,
          mucous membranes, and sclerae caused by increased bilirubin
          (hyperbilirubinemia). The ontology records "yellow skin" as a synonym.
      - question: "Does 'Atrial septal defect' share a parent term with 'Ventricular septal defect' in the HPO?"
        expected_answer: |
          Yes. Both Atrial septal defect (HP:0001631) and Ventricular septal
          defect (HP:0001629) are children of Abnormal cardiac septum morphology
          (HP:0001671), under abnormalities of the heart.
      - question: "What is the frequency convention HPO uses to annotate how often a phenotype occurs in a disease?"
        expected_answer: |
          HPO annotates phenotype-to-disease frequency using explicit ratios
          (e.g. 3/56 cases) and/or ordinal frequency categories -- Obligate
          (100%), Very frequent (80-99%), Frequent (30-79%), Occasional (5-29%),
          Very rare (1-4%), and Excluded (0%) -- so each annotation records how
          commonly the phenotype is seen in that disease.

  - name: "NCIt"
    display_name: "NCI Thesaurus"
    owl_file: "s3://neurosymbolicdl-storage-ontologybucket795a3498-gjp5avevev34/ontologies/ncit.owl"
    # NCI Thesaurus (NCIt) -- NCI's reference terminology and core biomedical
    # ontology, covering ~120,000 concepts across cancer-related diseases,
    # findings, drugs, anatomy, genes, and biological processes, with ~115,000
    # textual definitions and 400,000+ inter-concept relationships. The eval
    # set has two complementary kinds of question so the evolved program stays
    # competent at BOTH:
    #   (a) factual lookups of concepts NCIt actually defines (disease
    #       classifications, drug/agent roles, anatomic sites, gene/biomarker
    #       concepts, their definitions and parent/child relationships), and
    #   (b) interpretive "what does this concept/finding mean clinically"
    #       questions.
    # Every expected_answer stays grounded in NCIt's real class hierarchy and
    # definitions so the neurosymbolic retrieval drives the answer rather than
    # free speculation.
    questions:
      # --- (a) Factual concept lookups ---
      - question: "What is 'Melanoma' classified as in NCIt?"
        expected_answer: |
          NCIt classifies melanoma as a malignant neoplasm arising from
          melanocytes, the pigment-producing cells. It is a subtype of
          melanocytic neoplasm and, more broadly, of malignant neoplasm, most
          commonly affecting the skin but also occurring at mucosal and uveal
          (eye) sites.
      - question: "How does NCIt define 'Carcinoma'?"
        expected_answer: |
          In NCIt a carcinoma is a malignant neoplasm derived from epithelial
          cells (epithelial tissue). It is distinguished from sarcomas (which
          arise from mesenchymal/connective tissue) and from leukemias and
          lymphomas (hematopoietic origin), and it is the largest category of
          human cancers.
      - question: "What kind of entity is 'Trastuzumab' in NCIt?"
        expected_answer: |
          NCIt represents trastuzumab as a therapeutic agent -- specifically a
          humanized anti-HER2 (ERBB2) monoclonal antibody. It is a subtype of
          monoclonal antibody and antineoplastic agent, used to treat
          HER2-overexpressing cancers such as certain breast and gastric
          carcinomas.
      - question: "What is the relationship between 'Adenocarcinoma' and 'Carcinoma' in NCIt?"
        expected_answer: |
          Adenocarcinoma is a subtype (subclass) of carcinoma in NCIt --
          specifically a carcinoma with glandular (gland-forming) or secretory
          differentiation. So every adenocarcinoma is a carcinoma, which is in
          turn a malignant epithelial neoplasm.
      - question: "What is the 'EGFR gene' in NCIt and why is it clinically important?"
        expected_answer: |
          NCIt defines EGFR as the gene encoding the epidermal growth factor
          receptor, a receptor tyrosine kinase. It is cataloged as a gene concept
          with associated protein and mutation concepts; clinically it matters
          because activating EGFR mutations drive certain cancers (notably
          non-small cell lung carcinoma) and are the target of EGFR tyrosine
          kinase inhibitors.
      - question: "What does NCIt mean by 'Stage IV' in cancer staging?"
        expected_answer: |
          Stage IV in NCIt denotes the most advanced tumor stage, in which the
          cancer has spread (metastasized) from its primary site to distant
          organs or tissues. It is the highest category in the stage-grouping
          hierarchy derived from the TNM (tumor-node-metastasis) system NCIt
          represents.
      - question: "What is an 'antineoplastic agent' in NCIt?"
        expected_answer: |
          An antineoplastic agent in NCIt is a substance or drug whose role is to
          inhibit or halt the growth and spread of neoplasms (tumors). It is a
          parent category covering diverse subtypes such as chemotherapeutic
          agents, targeted therapies, monoclonal antibodies, and immunotherapies,
          grouped by their therapeutic role rather than chemical class.
      - question: "What is 'Apoptosis' as defined in NCIt?"
        expected_answer: |
          NCIt defines apoptosis as programmed cell death -- a regulated,
          energy-dependent process by which a cell undergoes orderly
          self-destruction. It is a biological-process concept, distinguished
          from necrosis (uncontrolled death), and its dysregulation is central to
          cancer biology because evading apoptosis is a hallmark of malignant
          cells.

      # --- (b) Interpretive "what does this mean clinically" questions ---
      - question: |
          A tumor is reported as a "HER2-positive invasive ductal carcinoma of
          the breast". Using NCIt's concepts, what does that classification mean
          and what does it imply for treatment?
        expected_answer: |
          Breaking it down through NCIt: invasive ductal carcinoma is a
          carcinoma (malignant epithelial neoplasm) of the breast that has
          invaded beyond the duct, and "HER2-positive" means the tumor
          overexpresses the HER2 (ERBB2) receptor. Practically, the HER2
          biomarker status is predictive: it identifies the tumor as a candidate
          for anti-HER2 targeted agents such as trastuzumab, which NCIt
          represents as an anti-HER2 monoclonal antibody. So the classification
          is not just descriptive -- it links the tumor's molecular feature to a
          specific class of antineoplastic therapy.
      - question: |
          A pathology report describes a neoplasm as "sarcoma" rather than
          "carcinoma". Based on how NCIt distinguishes these, what does that tell
          me about the tumor's origin?
        expected_answer: |
          In NCIt both are malignant neoplasms, but they are separated by tissue
          of origin: a carcinoma arises from epithelial cells, whereas a sarcoma
          arises from mesenchymal (connective-tissue) cells -- bone, cartilage,
          muscle, fat, or vascular tissue. So calling a tumor a sarcoma tells you
          it originates in connective/supporting tissue rather than in the
          epithelial linings and glands that give rise to the far more common
          carcinomas, which in turn shapes expected behavior and treatment.
      - question: |
          A targeted-therapy drug is annotated in NCIt as an "EGFR tyrosine
          kinase inhibitor". What does that concept practically tell me about how
          the drug works and which patients it suits?
        expected_answer: |
          The concept decomposes into the drug's mechanism and its target. An
          EGFR tyrosine kinase inhibitor blocks the kinase activity of the
          epidermal growth factor receptor, shutting down the growth-signaling
          cascade that activating EGFR mutations drive. Practically, NCIt's
          linkage of the EGFR gene, its mutations, and this inhibitor class
          implies the drug is a targeted therapy best suited to patients whose
          tumors carry activating EGFR mutations (classically EGFR-mutant
          non-small cell lung carcinoma), rather than a broadly cytotoxic
          chemotherapy given regardless of molecular status.
      - question: |
          A cancer is documented as having progressed from "Stage II" to
          "Stage IV". Using NCIt's staging concepts, what does that progression
          practically signify?
        expected_answer: |
          NCIt's stage grouping, derived from TNM, orders disease extent from
          localized to disseminated. Stage II is relatively localized/regional
          disease, whereas Stage IV is distant metastatic spread to other organs.
          So progression from II to IV practically signifies the cancer has
          metastasized beyond its primary site and regional nodes to distant
          tissue -- a shift that generally moves treatment intent from
          potentially curative (surgery/local therapy) toward systemic,
          often palliative, management and carries a markedly worse prognosis.
      - question: |
          A tumor's molecular profile shows "loss of apoptosis regulation". Given
          how NCIt defines apoptosis, what is the practical significance of this
          finding for the cancer?
        expected_answer: |
          Apoptosis in NCIt is programmed, regulated cell death that normally
          removes damaged or abnormal cells. Loss of its regulation practically
          means the tumor cells can evade this built-in self-destruct program, so
          cells that should have been eliminated survive and accumulate. This is
          a recognized hallmark of cancer: it supports uncontrolled growth,
          contributes to treatment resistance (since many chemotherapies work by
          triggering apoptosis), and flags apoptosis-restoring or pro-apoptotic
          strategies as a therapeutic angle.
      # === Added to double the NCIt eval set (13 -> 26), preserving the
      #     factual / interpretive balance (8 new factual + 5 new interpretive).
      #     Distinct NCIt concepts (diseases, agents, biomarkers, processes)
      #     grounded in its class hierarchy and definitions. ===

      # --- (a) Factual concept lookups (new) ---
      - question: "How does NCIt define 'Leukemia'?"
        expected_answer: |
          NCIt defines leukemia as a malignant neoplasm of hematopoietic
          (blood-forming) origin, arising from the uncontrolled proliferation of
          abnormal white blood cells in the bone marrow and blood. It is grouped
          under hematopoietic/lymphoid malignancies and distinguished from the
          solid carcinomas and sarcomas.
      - question: "What kind of entity is 'Imatinib' in NCIt?"
        expected_answer: |
          NCIt represents imatinib as a therapeutic agent -- specifically a
          small-molecule tyrosine kinase inhibitor (notably of BCR-ABL and KIT).
          It is a subtype of antineoplastic agent, used to treat chronic myeloid
          leukemia and gastrointestinal stromal tumors, grouped by its targeted
          mechanism.
      - question: "What is the 'BRAF gene' in NCIt and why is it clinically relevant?"
        expected_answer: |
          NCIt defines BRAF as the gene encoding a serine/threonine kinase in the
          MAPK signaling pathway. It is cataloged as a gene concept with
          associated protein and mutation concepts; clinically it matters because
          the BRAF V600E activating mutation drives melanoma and other cancers and
          is the target of BRAF inhibitors.
      - question: "How does NCIt define a 'biomarker'?"
        expected_answer: |
          In NCIt a biomarker is a measurable biological characteristic or
          substance whose presence, absence, or level serves as an indicator of a
          normal or pathological process, or of a response to therapy. It is used
          for diagnosis, prognosis, or prediction of treatment response (e.g.
          HER2, EGFR mutation status).
      - question: "What is 'Metastasis' as defined in NCIt?"
        expected_answer: |
          NCIt defines metastasis as the spread of malignant tumor cells from the
          primary site to a distant, non-contiguous site, where they establish a
          secondary tumor. It is a process concept central to staging; its
          presence (distant metastasis) corresponds to the most advanced
          (Stage IV) disease.
      - question: "What does NCIt mean by 'Remission' in the course of a disease?"
        expected_answer: |
          In NCIt remission denotes a decrease in or disappearance of the signs
          and symptoms of a disease (such as cancer), which may be complete (no
          detectable disease) or partial (a reduction in tumor burden). It is a
          finding/status concept describing disease state, not a cure.
      - question: "How does NCIt classify 'Lymphoma' relative to 'Leukemia'?"
        expected_answer: |
          NCIt groups both lymphoma and leukemia under hematopoietic and lymphoid
          malignancies, but distinguishes them by site: a lymphoma is a malignant
          neoplasm arising primarily in lymphoid tissue (lymph nodes and the
          lymphatic system), whereas a leukemia primarily involves the bone marrow
          and peripheral blood. They are sibling categories of blood-origin cancer
          rather than one being a subtype of the other.
      - question: "What is a 'chemotherapeutic agent' in NCIt?"
        expected_answer: |
          A chemotherapeutic agent in NCIt is an antineoplastic drug that kills or
          inhibits the proliferation of rapidly dividing cells, typically acting
          broadly (cytotoxically) rather than against a specific molecular target.
          It is a subtype of antineoplastic agent, contrasted with targeted
          therapies and immunotherapies by its non-selective mechanism.

      # --- (b) Interpretive "what does this mean clinically" questions (new) ---
      - question: |
          A tumor is reported as "triple-negative breast carcinoma". Using NCIt's
          concepts, what does that classification mean and what does it imply for
          treatment?
        expected_answer: |
          Through NCIt: it is a breast carcinoma (malignant epithelial neoplasm of
          the breast) that lacks the three biomarkers NCIt represents as targets --
          estrogen receptor, progesterone receptor, and HER2 (ERBB2)
          overexpression. Practically, "triple-negative" is a predictive biomarker
          profile: because the tumor expresses none of these, the targeted agents
          tied to them in NCIt (hormonal therapy, anti-HER2 antibodies like
          trastuzumab) are not applicable, so treatment relies on cytotoxic
          chemotherapy (and increasingly immunotherapy). The classification links
          absent molecular features to the exclusion of specific targeted
          therapies.
      - question: |
          A drug is annotated in NCIt as an "immune checkpoint inhibitor". What
          does that concept practically tell me about how it works and how it
          differs from chemotherapy?
        expected_answer: |
          The concept describes an immunotherapeutic agent that blocks inhibitory
          "checkpoint" signals (such as PD-1/PD-L1 or CTLA-4) which tumors exploit
          to evade immune attack. Practically, unlike a chemotherapeutic agent --
          which directly kills dividing cells -- a checkpoint inhibitor does not
          attack the tumor itself; it releases the brakes on the patient's own T
          cells so the immune system can recognize and destroy the cancer. NCIt's
          grouping of it under immunotherapy rather than cytotoxic chemotherapy
          reflects this fundamentally indirect, immune-mediated mechanism, which
          also explains its distinct (immune-related) toxicity profile.
      - question: |
          A pathology report calls a lesion "benign" rather than "malignant".
          Based on how NCIt distinguishes neoplasms, what does that tell me about
          the lesion's expected behavior?
        expected_answer: |
          NCIt separates neoplasms by behavior. A benign neoplasm grows locally,
          does not invade surrounding tissue destructively, and does not
          metastasize to distant sites, whereas a malignant neoplasm invades and
          can metastasize. Practically, calling the lesion benign tells me it is
          expected to remain localized and not spread -- generally not
          life-threatening by metastasis -- so management is typically local
          (observation or excision) rather than the systemic therapy a malignant,
          potentially metastatic tumor would require.
      - question: |
          A tumor's report notes "high tumor mutational burden (TMB)". Given
          NCIt's biomarker concepts, what is the practical significance of this
          finding?
        expected_answer: |
          NCIt treats tumor mutational burden as a biomarker -- a measurable
          characteristic indicating a biological state. A high TMB practically
          means the tumor carries many somatic mutations, which tend to produce
          more neoantigens that the immune system can recognize. As a predictive
          biomarker this flags the tumor as more likely to respond to immune
          checkpoint inhibitor therapy, so the finding informs treatment choice
          toward immunotherapy rather than merely describing the tumor.
      - question: |
          A cancer is documented as being in "complete remission" after therapy.
          Using NCIt's definition, what does that status practically signify and
          not signify?
        expected_answer: |
          NCIt defines remission as a decrease or disappearance of a disease's
          signs and symptoms, with complete remission meaning no detectable
          disease by the applied assessments. Practically it signifies that
          current methods find no evidence of cancer -- a very favorable response
          -- but it does not signify a definitive cure: microscopic residual
          disease can remain below detection thresholds, which is why relapse is
          possible and continued monitoring is standard. Complete remission is a
          disease-state finding, not a guarantee of permanent eradication.
  - name: "OBI"
    display_name: "Ontology for Biomedical Investigations"
    owl_file: "s3://neurosymbolicdl-storage-ontologybucket795a3498-gjp5avevev34/ontologies/obi.owl"
    # Ontology for Biomedical Investigations (OBI) -- an OBO Foundry ontology
    # that models the DESIGN and CONDUCT of biomedical investigations rather
    # than disease/anatomy concepts: assays, study designs, specimens and
    # material entities, data items and transformations, devices/instruments,
    # reagents, and the roles and planned processes that tie them together. It
    # builds on BFO (Basic Formal Ontology) upper-level categories and reuses
    # IAO (Information Artifact Ontology) for information entities. The eval set
    # has two complementary kinds of question so the evolved program stays
    # competent at BOTH:
    #   (a) factual lookups of entities OBI actually defines (assay, study
    #       design, specimen, data item, device, investigation, their
    #       definitions and parent/child relationships), and
    #   (b) interpretive "what does this classification mean for an experiment"
    #       questions.
    # Every expected_answer stays grounded in OBI's real class hierarchy and
    # textual definitions so the neurosymbolic retrieval drives the answer
    # rather than free speculation.
    questions:
      # --- (a) Factual concept lookups ---
      - question: "How does OBI define an 'assay'?"
        expected_answer: |
          OBI defines an assay as a planned process with the objective of
          producing information (a measurement datum) about an evaluant -- the
          material entity being examined -- by physically examining it. It is a
          subtype of planned process and is the central class OBI uses to model
          the act of measuring or testing a sample.
      - question: "What is a 'study design' in OBI?"
        expected_answer: |
          In OBI a study design is a plan specification (an information entity)
          that specifies how an investigation is to be carried out -- the
          independent and dependent variables, the groups, and the overall
          structure of the experiment. It is realized by the investigation's
          processes rather than being a material thing itself.
      - question: "What kind of entity is a 'specimen' in OBI, and how does it relate to a material sample?"
        expected_answer: |
          OBI treats a specimen as a material entity that has a specimen role --
          i.e. a material thing taken or collected to serve as a representative
          sample for study. The specimen role is borne by the material entity, so
          'specimen' is a role-based classification layered on a material sample
          rather than a distinct kind of substance.
      - question: "What is a 'data item' in OBI (via IAO), and how does it differ from a measurement datum?"
        expected_answer: |
          A data item is an information content entity intended to be a truthful
          statement about something and structured for computational processing;
          OBI reuses this from IAO. A measurement datum is a more specific
          subtype: a data item that is the output of a measurement assay about
          some quality of an entity. So every measurement datum is a data item,
          but data items also include non-measurement information.
      - question: "What does OBI mean by an 'investigation'?"
        expected_answer: |
          OBI defines an investigation as a planned process that consists of
          parts -- study designs being executed, assays, data transformations --
          carried out to test one or more hypotheses or to characterize some
          entities. It is the top-level process that groups the specific assays
          and analyses performed into a coherent study.
      - question: "What is a 'device' in OBI?"
        expected_answer: |
          In OBI a device is a material entity designed to perform a function,
          used as an instrument in a process (for example an assay). It is a
          processed material/artifact that bears a function; mass spectrometers,
          sequencers, and centrifuges are modeled as devices realized in the
          assays they participate in.
      - question: "How does OBI represent a 'planned process', and why is that class central?"
        expected_answer: |
          A planned process in OBI is a process that realizes a plan (a plan
          specification concretized as a realizable entity) and is carried out
          to achieve an objective. It is central because assays, data
          transformations, material-processing steps, and whole investigations
          are all subtypes of planned process -- it is the backbone OBI uses to
          model deliberate experimental activity.
      - question: "What is a 'data transformation' in OBI?"
        expected_answer: |
          A data transformation is a planned process that produces output data
          from input data by means of an algorithm or computational method -- for
          example normalization, statistical analysis, or sequence alignment. It
          is distinguished from an assay (which examines a material evaluant) in
          that its input and output are both information entities, not physical
          samples.

      # --- (b) Interpretive "what does this mean for an experiment" questions ---
      - question: |
          An experiment is annotated in OBI terms as an "assay" whose output is a
          "measurement datum" about a "specimen". Walking through OBI's classes,
          what does that chain of annotations actually describe?
        expected_answer: |
          Reading it through OBI: a material sample bearing a specimen role (the
          specimen) is the evaluant that gets physically examined by an assay --
          a planned process whose objective is to produce information about that
          evaluant. The assay's output, a measurement datum, is a data item
          recording some measured quality of the specimen. So the chain describes
          a complete measurement act: take a representative sample, examine it in
          a defined procedure, and emit a structured, computable measurement
          about it -- material in, information out.
      - question: |
          Why does OBI model a "specimen" as a material entity bearing a role
          rather than as its own distinct kind of substance, and what does that
          buy an experiment's data model?
        expected_answer: |
          OBI follows BFO's split between what a thing IS (its material type --
          e.g. a blood sample, a tissue section) and the role it PLAYS in a
          context. 'Specimen' is contextual: the same blood sample is a specimen
          when collected for study and merely blood otherwise. Modeling it as a
          material entity bearing a specimen role lets the data model keep the
          sample's intrinsic identity stable while attaching, removing, or
          changing the specimen role as the sample moves through the
          investigation -- so provenance and reuse are tracked without
          reclassifying the substance itself.
      - question: |
          A pipeline step is classified in OBI as a "data transformation" rather
          than an "assay". Based on how OBI distinguishes them, what does that
          classification tell me about the step's inputs and outputs?
        expected_answer: |
          Both are planned processes, but OBI separates them by what they act on.
          An assay physically examines a material evaluant and produces
          information about it (material in, information out). A data
          transformation takes information as input and produces information as
          output via an algorithm -- no physical sample is examined. So calling
          the step a data transformation tells me it is a purely computational
          stage (e.g. normalization or statistical analysis operating on existing
          data), not a bench measurement that touches a specimen.
      - question: |
          Two activities are grouped under one OBI "investigation". Using OBI's
          process model, what does placing them under a single investigation
          imply about how they relate?
        expected_answer: |
          In OBI an investigation is a planned process whose parts are the
          specific processes carried out to test hypotheses or characterize
          entities. Grouping two activities under one investigation implies they
          are parts of the same overarching study plan -- executed in service of
          the same objective and study design, sharing provenance and context --
          rather than independent one-off procedures. It lets the data model tie
          their assays, data transformations, and outputs together as a coherent
          whole.
      - question: |
          An instrument used in a protocol is annotated as a "device" realized in
          an "assay". Given OBI's treatment of functions and roles, what does that
          annotation practically capture?
        expected_answer: |
          OBI models a device as a material entity that bears a function -- a
          disposition to perform some action -- which is realized only when the
          device actually participates in a process. Annotating it as a device
          realized in an assay captures two things: the instrument's standing
          capability (its function, independent of any single run) and the fact
          that this capability is actualized during the specific assay. That
          separation lets the model describe what an instrument can do, and
          record each occasion on which it did it, without conflating the two.
      # === Added to double the OBI eval set (12 -> 24), preserving the
      #     factual / interpretive balance (7 new factual + 5 new interpretive).
      #     Distinct OBI/IAO/BFO-grounded concepts, deeply different from the
      #     existing items. ===

      # --- (a) Factual concept lookups (new) ---
      - question: "What is a 'material entity' in OBI, and how does it relate to BFO?"
        expected_answer: |
          OBI reuses material entity from BFO: it is an independent continuant
          that has some portion of matter as part -- it occupies space and
          persists through time as a bearer. In OBI, specimens, reagents, and
          devices are all material entities; it is the category of physical thing
          that assays examine and that bears roles and functions.
      - question: "How does OBI define a 'reagent'?"
        expected_answer: |
          OBI defines a reagent as a material entity that bears a reagent role --
          a processed material that participates in and is largely consumed or
          transformed during an assay or other planned process to enable or
          detect a reaction, without being the evaluant of interest itself (for
          example a buffer, stain, or antibody used in a protocol).
      - question: "What is a 'protocol' in OBI?"
        expected_answer: |
          In OBI a protocol is a plan specification (an information content
          entity) that describes the steps and conditions for carrying out a
          planned process such as an assay. It is concretized as a realizable
          entity and realized when an investigator actually executes the
          procedure; it is information, not a material thing.
      - question: "What is an 'organism' in OBI?"
        expected_answer: |
          OBI treats an organism as a material entity -- a BFO independent
          continuant -- that is an individual living thing. Organisms serve as
          study subjects, as sources of specimens, and as the bearers of roles
          (such as the subject role) within an investigation.
      - question: "What is an 'objective specification' in OBI?"
        expected_answer: |
          An objective specification in OBI is an information content entity (a
          directive) that describes the intended goal or output of a planned
          process. A planned process is carried out to achieve its objective, so
          the objective specification states what the process is meant to
          accomplish -- for example, the objective of an assay is to produce a
          measurement datum.
      - question: "How does OBI represent a 'measurement datum' in relation to IAO?"
        expected_answer: |
          OBI builds measurement datum on IAO's information content entity /
          data item: a measurement datum is a data item that is the output of a
          measurement assay and represents the value of some measured quality of
          the evaluant. It inherits from IAO's information artifact framework and
          specializes it to the result of a measurement.
      - question: "What is an 'analyte' in the context of OBI assays?"
        expected_answer: |
          In OBI an analyte is the entity (or quality of an entity) that an assay
          is designed to detect or measure within the evaluant -- the specific
          target the measurement is about. It is the thing being quantified or
          identified, as distinct from the specimen (the material sample) and the
          reagents used to perform the measurement.
      - question: "What is a 'processed material' in OBI?"
        expected_answer: |
          A processed material in OBI is a material entity that is the output of
          a material-processing planned process -- something that has been
          deliberately created or altered from input materials (for example a
          purified extract, a stained slide, or a manufactured device). It is
          distinguished from naturally occurring material entities by having been
          produced through a planned process.

      # --- (b) Interpretive "what does this mean for an experiment" questions (new) ---
      - question: |
          A protocol step is annotated as a "material-processing" planned process
          (e.g. centrifugation) rather than an assay. Based on OBI's model, what
          does that classification tell me about the step?
        expected_answer: |
          Both are planned processes, but OBI distinguishes them by purpose and
          output. An assay examines a material evaluant to produce information (a
          measurement datum). A material-processing process instead takes a
          material entity as input and produces a transformed material entity as
          output -- it changes the sample (separating, purifying, aliquoting)
          rather than measuring it. So classifying centrifugation as
          material processing tells me it is a sample-preparation step that yields
          another material thing, not a measurement that emits data about the
          specimen.
      - question: |
          An entity is annotated as a "reagent" rather than the "evaluant" of an
          assay. Using OBI's role-based model, what practical distinction does
          that draw?
        expected_answer: |
          OBI assigns roles by what a material plays in the process. The evaluant
          is the material entity the assay is actually about -- the thing being
          examined -- whereas a reagent bears a reagent role: it is used up or
          transformed to enable or reveal the measurement but is not the subject
          of interest. Practically, the distinction tells me which material the
          resulting data describe (the evaluant) versus which materials are
          merely instrumental to obtaining them (the reagents), which is exactly
          what provenance and interpretation of the measurement require.
      - question: |
          Two investigations reuse the same "study design". Given that OBI models
          a study design as a plan specification realized by processes, what does
          sharing one design imply?
        expected_answer: |
          Because a study design is an information content entity (a plan
          specification) rather than a material or a one-off event, the same
          design can be concretized and realized by many separate investigations.
          Sharing one design practically implies the two investigations follow the
          same specified structure -- the same variables, groups, and procedure --
          so their executions are comparable and the design is a reusable template
          instantiated independently each time, not a thing consumed by a single
          study. This supports standardization and cross-study comparison.
      - question: |
          A protocol specifies an objective but a run of it fails to produce the
          intended measurement datum. Using OBI's plan/realization model, how do
          I describe what happened?
        expected_answer: |
          OBI separates the plan (the protocol, a plan specification, with its
          objective specification) from the planned process that realizes it. The
          protocol and its objective still exist as information regardless of any
          run. The failed execution is a planned process that was carried out to
          achieve the objective but did not produce the specified output. So I
          describe it as a realization of the plan that did not satisfy its
          objective specification -- the plan is intact and re-runnable; it is the
          particular process occurrence that fell short, cleanly separating "what
          was intended" from "what actually occurred".
      - question: |
          A dataset is annotated with both a "measurement datum" (from an assay)
          and a derived value from a "data transformation". Walking through OBI,
          how do these two information entities relate?
        expected_answer: |
          Through OBI: the measurement datum is a data item output by an assay
          that physically examined a material evaluant -- the primary, measured
          information (material in, information out). The derived value is the
          output of a data transformation, a planned process that took that datum
          (information) as input and produced new information by an algorithm
          (information in, information out). So they form a provenance chain: the
          raw measurement is the evidential source, and the transformed value is a
          computed descendant of it. OBI lets the model trace the derived result
          back through the transformation to the originating measurement and its
          specimen.
  - name: "OGMS"
    display_name: "Ontology for General Medical Science"
    owl_file: "s3://neurosymbolicdl-storage-ontologybucket795a3498-gjp5avevev34/ontologies/ogms.owl"
    # Ontology for General Medical Science (OGMS) -- an OBO Foundry ontology
    # that provides a formal framework for the CLINICAL domain, bridging basic
    # biomedical science and medicine. It models disease and disorder, the
    # pathological processes that realize them, their manifestations (signs and
    # symptoms), and the clinical workflow that observes and interprets them
    # (clinical history, examination, diagnosis). It is built directly on BFO
    # upper-level categories and reuses OBI/IAO patterns. The eval set has two
    # complementary kinds of question so the evolved program stays competent at
    # BOTH:
    #   (a) factual lookups of entities OGMS actually defines (disorder,
    #       disease, pathological process, sign, symptom, diagnosis, clinical
    #       picture, their definitions and relationships), and
    #   (b) interpretive "what does this clinical classification mean" questions.
    # Every expected_answer stays grounded in OGMS's real class hierarchy and
    # textual definitions so the neurosymbolic retrieval drives the answer
    # rather than free speculation.
    questions:
      # --- (a) Factual concept lookups ---
      - question: "How does OGMS distinguish a 'disorder' from a 'disease'?"
        expected_answer: |
          In OGMS a disorder is a material entity: a causally relatively isolated
          combination of physical components that is clinically abnormal -- the
          underlying bodily basis. A disease is a disposition: it is borne by an
          organism and inheres in it because of the disorder, and it is realized
          by pathological processes. So the disorder is the physical substrate
          and the disease is the disposition to malfunction that the disorder
          grounds; they are different ontological kinds, not synonyms.
      - question: "What is a 'pathological process' in OGMS?"
        expected_answer: |
          A pathological process in OGMS is a bodily process that is clinically
          abnormal and is the realization of a disease. It is an occurrent -- it
          unfolds in time -- and it is what actually produces the signs and
          symptoms a clinician observes. The disease (a disposition) is realized
          in these pathological processes.
      - question: "How does OGMS define a 'sign' versus a 'symptom'?"
        expected_answer: |
          Both are manifestations of a bodily process, but OGMS separates them by
          who can observe them. A sign is a bodily feature of a patient that is
          observed in an examination and judged to be of clinical significance by
          an examiner (observable by a third party -- e.g. a rash, a murmur). A
          symptom is a bodily feature observed by the patient themselves and
          taken to be of clinical significance (e.g. pain, nausea). Signs are
          objectively observable by others; symptoms are the patient's own
          experience.
      - question: "What is a 'diagnosis' in OGMS?"
        expected_answer: |
          In OGMS a diagnosis is a conclusion -- an information content entity --
          reached by a clinician that asserts the patient has a particular
          disease (or that a specific disorder is present), produced by
          interpreting the patient's clinical picture. It is the output of the
          diagnostic process, not the disease itself.
      - question: "What does OGMS mean by a 'clinical picture'?"
        expected_answer: |
          A clinical picture in OGMS is a representation (an information content
          entity) created by a clinician of the salient features of a patient at
          a given time -- the collected signs, symptoms, history and findings. It
          is the evidential basis the clinician interprets to arrive at a
          diagnosis.
      - question: "How does OGMS relate 'disease', 'disorder' and 'pathological process' to one another?"
        expected_answer: |
          OGMS ties them in a chain: a disorder (a clinically abnormal material
          entity) is the bearer basis for a disease (a disposition that inheres
          in the organism because of the disorder), and the disease is realized
          by one or more pathological processes (clinically abnormal bodily
          processes). Those processes in turn give rise to signs and symptoms. So
          disorder -> grounds -> disease -> realized in -> pathological process ->
          manifests as -> signs/symptoms.
      - question: "What is 'etiology' or an 'etiological process' in OGMS terms?"
        expected_answer: |
          An etiological process in OGMS is the process that produces or causes a
          disorder to come into being -- the causal origin of the clinically
          abnormal material basis. It precedes and explains the disorder, which
          in turn grounds the disease; capturing it lets the model represent not
          just that a disease exists but how its physical substrate arose.

      # --- (b) Interpretive "what does this clinical classification mean" questions ---
      - question: |
          A patient record states the patient "has a disease realized by an
          ongoing pathological process, manifesting as signs and symptoms".
          Walking through OGMS's classes, what does that chain actually describe?
        expected_answer: |
          Reading it through OGMS: the patient bears a disease, which is a
          disposition grounded in some clinically abnormal disorder (material
          basis) in their body. That disposition is currently being realized --
          an ongoing pathological process (a clinically abnormal bodily process)
          is actually unfolding. That process produces manifestations: signs
          (features a third party can observe) and symptoms (features the patient
          experiences). So the chain describes an active, not merely latent,
          illness: a physical abnormality grounding a malfunction-disposition
          that is right now playing out and showing itself to both clinician and
          patient.
      - question: |
          Why does OGMS model a "disease" as a disposition rather than as the
          physical abnormality itself, and what does that distinction buy a
          clinical data model?
        expected_answer: |
          OGMS separates the material basis (the disorder) from the capacity to
          malfunction (the disease, a disposition). A disposition can exist
          without being realized -- so the model can represent a disease that is
          present but currently asymptomatic (not yet realized in a pathological
          process), and distinguish "has the disease" from "the disease is
          active". It also lets one disorder ground a disposition whose
          realization varies over time, so onset, remission and relapse are
          modeled as the disposition being realized or not, without changing what
          the disease fundamentally is.
      - question: |
          A finding is recorded as a "sign" rather than a "symptom". Based on how
          OGMS distinguishes them, what does that classification tell me about how
          the finding was obtained?
        expected_answer: |
          OGMS splits them by observer. Classifying the finding as a sign tells
          me it was observed by a third party -- the examiner -- during an
          examination and judged clinically significant (an objectively
          observable bodily feature such as a measured fever, a visible lesion,
          or an auscultated murmur). Had it been a symptom, it would have been
          something the patient themselves reported experiencing (pain, fatigue).
          So "sign" marks the finding as externally/clinically observed evidence
          rather than patient-reported experience.
      - question: |
          A clinician reaches a "diagnosis" by interpreting a "clinical picture".
          Using OGMS's model, what does that relationship imply about what a
          diagnosis is and is not?
        expected_answer: |
          In OGMS the clinical picture is a representation of the patient's
          salient features (signs, symptoms, history), and the diagnosis is a
          conclusion -- an information content entity -- the clinician derives by
          interpreting that picture. The relationship implies the diagnosis is an
          epistemic assertion about which disease is present, not the disease or
          disorder itself. It can be revised as the clinical picture changes or
          is reinterpreted, and it is distinct from the underlying bodily reality
          it is about -- a judgement derived from evidence, not the condition
          itself.
      # === Added to double the OGMS eval set (12 -> 24), preserving the
      #     factual / interpretive balance (7 new factual + 5 new interpretive).
      #     Distinct OGMS/BFO-grounded clinical concepts, deeply different from
      #     the existing items. ===

      # --- (a) Factual concept lookups (new) ---
      - question: "What is a 'patient' in OGMS, and why is it modeled that way?"
        expected_answer: |
          In OGMS a patient is a human organism bearing a patient role -- a role
          (a realizable dependent continuant) acquired by entering into a care
          relationship with a healthcare provider. It is modeled as a role rather
          than a kind of organism because being a patient is contextual and can be
          gained or lost without changing what the person intrinsically is.
      - question: "What does OGMS mean by a 'bodily process'?"
        expected_answer: |
          A bodily process in OGMS is a process (a BFO occurrent) that occurs
          within or is carried out by an organism's body. Normal bodily processes
          are physiological; a pathological process is the subtype that is
          clinically abnormal and realizes a disease.
      - question: "How does OGMS define a 'clinical finding'?"
        expected_answer: |
          A clinical finding in OGMS is an information content entity representing
          an observation made about a patient during the clinical process -- the
          recorded result of observing signs, symptoms, or measurements. Findings
          are the elements collected into the clinical picture that the clinician
          interprets.
      - question: "What is the 'disease course' in OGMS?"
        expected_answer: |
          The disease course in OGMS is the totality of the processes through
          which a disease is realized over time in a patient -- how the disease
          unfolds, including onset, progression, remission, and relapse. It is an
          occurrent-level view of the disease's realization across the patient's
          history.
      - question: "What is a 'disorder' in OGMS, in BFO terms?"
        expected_answer: |
          In OGMS a disorder is a material entity -- a causally relatively
          isolated combination of physical components of an organism that is
          clinically abnormal. In BFO terms it is an independent continuant (the
          physical substrate), and it is what grounds the disease (a disposition)
          that inheres in the organism because of it.
      - question: "How does OGMS characterize a 'laboratory finding' or test result?"
        expected_answer: |
          OGMS characterizes a laboratory/test result as an information content
          entity -- a datum produced by examining a specimen or measuring some
          quality of the patient -- that contributes to the clinical picture. It
          is observed information about the patient, interpreted alongside signs
          and symptoms toward a diagnosis, rather than the bodily abnormality
          itself.

      # --- (b) Interpretive "what does this clinical classification mean" questions (new) ---
      - question: |
          A record states a patient "has a disease that is not currently realized
          by any pathological process". Using OGMS, what clinical situation does
          that describe?
        expected_answer: |
          Through OGMS: the patient bears a disease -- a disposition grounded in
          some disorder -- but no pathological process is presently unfolding to
          realize it. A disposition can exist without being realized, so this
          describes a disease that is present but currently inactive or latent:
          the capacity to malfunction exists (the disorder grounds it), yet it is
          not producing signs or symptoms right now. Clinically this corresponds
          to an asymptomatic or quiescent/remission state -- the patient still
          "has" the disease, but it is not active.
      - question: |
          A clinician records a "sign" and the patient reports a "symptom" that
          point to the same underlying problem. Using OGMS, how do these two
          manifestations relate to the pathological process?
        expected_answer: |
          In OGMS both signs and symptoms are manifestations produced by the same
          underlying pathological process (the clinically abnormal bodily process
          realizing the disease). They differ only by observer: the sign is a
          bodily feature observed by a third-party examiner and judged clinically
          significant, while the symptom is a bodily feature the patient
          themselves experiences and reports. So they are two observational
          windows -- external and self-reported -- onto one and the same abnormal
          process, which is why they can converge on the same problem.
      - question: |
          Two clinicians reach different diagnoses from the same clinical picture.
          Using OGMS's model of diagnosis, how is that possible and what does it
          reveal about what a diagnosis is?
        expected_answer: |
          OGMS models the diagnosis as an information content entity -- a
          conclusion a clinician derives by interpreting the clinical picture --
          not as the disease or disorder itself. Because it is an interpretive
          assertion about which disease is present, two clinicians interpreting
          the same picture can legitimately reach different conclusions. This
          reveals that a diagnosis is epistemic and revisable: it is a judgement
          about the underlying bodily reality, distinct from and not guaranteed to
          match that reality, which is precisely why diagnoses can be wrong,
          disputed, or updated as the picture is reinterpreted.
      - question: |
          A disease is described as having a known "etiological process" that
          produced its disorder. Using OGMS, what does identifying the etiology
          add beyond stating that the disease exists?
        expected_answer: |
          OGMS's etiological process is the process that causes the disorder (the
          clinically abnormal material basis) to come into being, preceding and
          explaining it. Stating merely that a disease exists captures the current
          disposition and its substrate; adding the etiology captures the causal
          origin -- how the physical abnormality arose in the first place.
          Practically this lets the model represent not just that the patient has
          the disease but why, connecting cause (etiological process) to substrate
          (disorder) to disposition (disease) to realization (pathological
          process), which supports prevention and causal reasoning rather than
          description alone.
      - question: |
          A patient's status changes from "disease active" to "in remission" and
          later "relapse". Using OGMS's disposition-and-realization model, what is
          actually changing at each step while the disease persists?
        expected_answer: |
          OGMS treats the disease as a disposition grounded in a disorder, which
          is realized in pathological processes. What changes across active ->
          remission -> relapse is whether that disposition is currently being
          realized, not whether the disease exists. "Active" means a pathological
          process is unfolding (producing signs/symptoms); "remission" means the
          disposition is present but not currently realized (no active
          pathological process, so manifestations subside); "relapse" means the
          disposition is realized again. The disease itself persists throughout as
          the same disposition -- it is the realization that switches on and off,
          which is exactly what the disposition model is designed to express.
  - name: "BFO"
    display_name: "Basic Formal Ontology"
    owl_file: "s3://neurosymbolicdl-storage-ontologybucket795a3498-gjp5avevev34/ontologies/bfo.owl"
    # Basic Formal Ontology (BFO) -- the small, top-level UPPER ontology that
    # OBO Foundry ontologies (including OBI and OGMS above) build on. Unlike the
    # domain ontologies here, BFO defines no diseases, anatomy or assays; it
    # defines the most general categories of reality: the continuant/occurrent
    # split, independent vs dependent continuants, qualities, roles,
    # dispositions, functions, processes, spatial and temporal regions, and the
    # core relations (inheres in, realized in, participates in, part of). The
    # eval set has two complementary kinds of question so the evolved program
    # stays competent at BOTH:
    #   (a) factual lookups of the categories BFO actually defines and their
    #       definitions/parent-child relationships, and
    #   (b) interpretive "why does BFO draw this distinction / how do I classify
    #       X" questions.
    # Every expected_answer stays grounded in BFO's real category hierarchy and
    # textual definitions so the neurosymbolic retrieval drives the answer
    # rather than free speculation.
    questions:
      # --- (a) Factual category lookups ---
      - question: "What is the top-level distinction in BFO between a 'continuant' and an 'occurrent'?"
        expected_answer: |
          BFO's most fundamental split is between continuants and occurrents. A
          continuant is an entity that persists through time while maintaining
          its identity and is wholly present at any moment it exists (things:
          objects, qualities, roles). An occurrent is an entity that unfolds or
          happens in time and has temporal parts (processes, events). Roughly:
          continuants are the things that exist, occurrents are what happens to
          and among them.
      - question: "How does BFO distinguish an 'independent continuant' from a 'dependent continuant'?"
        expected_answer: |
          An independent continuant is a continuant that does not depend on any
          other entity to exist -- the bearers, such as material entities
          (objects) and the sites/boundaries associated with them. A dependent
          continuant exists only by inhering in or being borne by some
          independent continuant: qualities, roles, dispositions and functions
          all require a bearer. So independent continuants can stand alone;
          dependent continuants cannot exist without something to inhere in.
      - question: "What is a 'quality' in BFO?"
        expected_answer: |
          A quality in BFO is a specifically dependent continuant that, if it
          exists, is fully exhibited or realized whenever it is borne -- it needs
          no further process to be manifest. Examples are the mass, color or
          temperature of an object. A quality inheres in its bearer and is simply
          present (unlike a disposition, which may be unrealized).
      - question: "How does BFO define a 'role'?"
        expected_answer: |
          A role in BFO is a realizable dependent continuant that a bearer has
          because of how it is placed in some social, institutional or contextual
          setting, and that it can gain or lose without changing what the bearer
          intrinsically is -- it is externally grounded. A person's role as a
          patient, or a material's role as a specimen, are roles: contingent and
          context-dependent rather than part of the thing's essential nature.
      - question: "What is a 'disposition' in BFO, and how does it differ from a quality?"
        expected_answer: |
          A disposition is a realizable dependent continuant: a tendency or
          capacity of its bearer, grounded in the bearer's physical makeup, that
          is realized only in certain processes under certain conditions (e.g.
          fragility realized in breaking). Unlike a quality -- which is fully
          exhibited simply by being borne -- a disposition can exist unrealized,
          waiting for the triggering process. Both inhere in a bearer, but a
          disposition points to a possible future realization.
      - question: "How does BFO define a 'function', and how does it relate to a disposition?"
        expected_answer: |
          A function in BFO is a special kind of disposition: a disposition that
          exists because its bearer is the kind of thing it is -- by design (an
          artifact's function) or by selection/evolution (a biological function)
          -- and that is realized in the process the bearer is meant to carry
          out. So every function is a disposition, but one whose existence is
          explained by the bearer's physical or designed makeup being for that
          end (e.g. the heart's function to pump blood).
      - question: "What is a 'process' in BFO?"
        expected_answer: |
          A process in BFO is an occurrent that has temporal parts and depends on
          one or more material entities as its participants -- it unfolds in time
          and happens to or among continuants. The realization of a disposition
          or function is a process, and processes are what dependent continuants
          like dispositions get realized in.
      - question: "What does BFO mean by a 'material entity'?"
        expected_answer: |
          A material entity in BFO is an independent continuant that has some
          portion of matter as part -- it occupies space and persists through
          time as a bearer (objects, object aggregates, fiat object parts). It is
          the paradigmatic independent continuant: the kind of thing that
          qualities, roles, dispositions and functions inhere in or are borne by.

      # --- (b) Interpretive "why this distinction / how to classify" questions ---
      - question: |
          I want to represent "the fragility of a glass" and "the mass of a
          glass". Using BFO's categories, how should each be classified and why
          are they not the same kind of entity?
        expected_answer: |
          Both are specifically dependent continuants inhering in the glass, but
          BFO classes them differently by how they manifest. Mass is a quality:
          it is fully exhibited simply by being borne -- the glass has its mass at
          every moment, no triggering process needed. Fragility is a disposition:
          a capacity grounded in the glass's structure that is realized only in a
          process (breaking) under certain conditions, and that can exist
          unrealized indefinitely. So mass is "always on" while fragility is a
          latent tendency awaiting realization -- which is exactly why BFO
          separates qualities from dispositions.
      - question: |
          Why does BFO treat "patient" as a role rather than as a kind of
          material entity, and what does that buy a data model?
        expected_answer: |
          In BFO 'patient' is a realizable, externally grounded dependent
          continuant -- a role -- because being a patient is contingent on
          context (entering a care relationship) and can be gained or lost
          without changing what the person intrinsically is (a human material
          entity). Modeling it as a role rather than a type of material entity
          lets the data model keep the person's identity and intrinsic
          classification stable while attaching or removing the patient role as
          they move in and out of care, so the same individual can bear many
          roles over time without being reclassified as a different kind of
          thing.
      - question: |
          How do I decide whether something belongs under BFO's "continuant" or
          "occurrent" branch, and why does that top-level choice matter?
        expected_answer: |
          Ask whether the entity persists through time while being wholly present
          at each moment (a continuant -- a thing: an object, a quality, a role) or
          whether it unfolds in time with temporal parts (an occurrent -- a
          happening: a process, an event). A heart is a continuant; its beating
          is an occurrent. The choice matters because it fixes which relations
          and further categories apply: continuants bear qualities and
          participate in processes, whereas occurrents have temporal parts and
          have participants. Getting the branch right determines the entire
          downstream modeling, which is why BFO forces this distinction first.
      - question: |
          A capability is annotated in BFO as a "function" rather than a plain
          "disposition". Based on how BFO relates the two, what extra claim is
          that annotation making?
        expected_answer: |
          Every function is a disposition, so calling it a function keeps all the
          disposition semantics (a realizable capacity, grounded in the bearer,
          realized in a process). The extra claim is about WHY the capacity
          exists: a function is a disposition the bearer has because of the kind
          of thing it is -- either designed for that end (an artifact) or selected
          for it (a biological trait). So annotating a capability as a function
          asserts not just that the bearer can do something, but that doing it is
          what the bearer is for -- its existence is explained by design or
          selection, not merely by incidental physical makeup.
      # === Added to double the BFO eval set (12 -> 24), preserving the
      #     factual / interpretive balance (8 new factual + 4 new interpretive).
      #     Distinct BFO upper-level categories and relations, deeply different
      #     from the existing items. ===

      # --- (a) Factual category lookups (new) ---
      - question: "What is a 'generically dependent continuant' in BFO, and how does it differ from a specifically dependent continuant?"
        expected_answer: |
          A generically dependent continuant (GDC) is a continuant that depends
          on some bearer but can be copied and migrate between bearers -- an
          information entity such as the content of a document or a sequence,
          which can exist concretized in many carriers. A specifically dependent
          continuant (quality, role, disposition) depends on and inheres in one
          particular bearer and cannot migrate. So a GDC is bearer-dependent but
          multiply realizable, whereas an SDC is tied to its single specific
          bearer.
      - question: "What does BFO's relation 'inheres in' connect?"
        expected_answer: |
          "Inheres in" is the relation connecting a specifically dependent
          continuant to its bearer -- the independent continuant it depends on.
          A quality, role, or disposition inheres in the material entity that
          bears it (e.g. a color inheres in an apple, a patient role inheres in a
          person). It expresses one-sided existential dependence of the dependent
          continuant on its bearer.
      - question: "What does the BFO relation 'realized in' relate?"
        expected_answer: |
          "Realized in" relates a realizable entity (a role, disposition, or
          function) to the process that actualizes it. A disposition like
          fragility is realized in a breaking process; a function like the
          heart's is realized in the process of pumping. It connects a continuant
          capacity to the occurrent in which that capacity is manifested.
      - question: "What is a 'spatial region' in BFO?"
        expected_answer: |
          A spatial region in BFO is a continuant part of space itself -- an
          independent continuant that is a region of space (zero-, one-, two-, or
          three-dimensional). It is distinct from the material entities that may
          occupy it; sites and the places material things occupy are described
          relative to spatial regions.
      - question: "What is a 'temporal region' in BFO, and which branch does it belong to?"
        expected_answer: |
          A temporal region in BFO is an occurrent -- a part of time itself,
          either a temporal instant (zero-dimensional) or a temporal interval
          (one-dimensional). Because it is a region of time rather than a
          persisting thing, it belongs to the occurrent branch; processes occupy
          temporal regions much as material entities occupy spatial regions.
      - question: "What is an 'object' in BFO?"
        expected_answer: |
          An object in BFO is a material entity (an independent continuant) that
          is spatially extended, maximally self-connected, and causally
          relatively isolated -- a coherent, bounded physical individual such as
          an organism, a cell, or a rock. It is the paradigmatic material entity
          that bears qualities, roles, dispositions, and functions.
      - question: "What does the BFO relation 'participates in' connect?"
        expected_answer: |
          "Participates in" connects a continuant to an occurrent: it relates a
          material entity (or other continuant) to a process in which it takes
          part. For example, an enzyme participates in a reaction, a person
          participates in an examination. It is how BFO ties the things that
          exist (continuants) to the happenings they are involved in
          (occurrents).
      - question: "What is a 'fiat object part' in BFO?"
        expected_answer: |
          A fiat object part in BFO is a material entity that is a part of an
          object demarcated by a boundary that is not a physical discontinuity
          but is drawn by human convention or fiat -- for example the upper half
          of a body, or a quadrant of the abdomen. It is a genuine material part
          whose delimitation is conceptual rather than marked by a real
          physical seam.

      # --- (b) Interpretive "why this distinction / how to classify" questions (new) ---
      - question: |
          I want to represent the text of a report and the particular printed
          copy on my desk. Using BFO's categories, how should each be classified,
          and how do they relate?
        expected_answer: |
          The text (the information content) is a generically dependent
          continuant: it depends on some bearer but can be copied across many
          carriers without being tied to one. The particular printed copy is a
          material entity (an independent continuant / object) that bears a
          concretization of that content. They relate by concretization: the GDC
          (the text) is concretized in the specific material copy, and the same
          text can be concretized again in other copies. This is exactly why BFO
          separates the migratable information from any one physical carrier --
          so the content's identity survives across copies while each copy is its
          own independent thing.
      - question: |
          Why does BFO insist that a process cannot bear a quality, whereas a
          material entity can? What does this constraint prevent?
        expected_answer: |
          Qualities are specifically dependent continuants, and in BFO dependent
          continuants inhere only in independent continuants (bearers that are
          wholly present at each moment). A process is an occurrent -- it has
          temporal parts and is never wholly present at an instant -- so it is not
          the right kind of thing to bear a continuant quality. The constraint
          prevents category errors such as attributing a persisting, wholly
          present property to something that only unfolds over time; instead
          processes have attributes via their participants and their temporal
          structure. Keeping qualities on continuants preserves BFO's clean
          continuant/occurrent split.
      - question: |
          A modeler wants to say "this reaction happened during January". Using
          BFO's treatment of occurrents and temporal regions, how is that stated,
          and why is a reaction not itself a temporal region?
        expected_answer: |
          Both the reaction and January are occurrents, but they are different
          kinds. The reaction is a process -- an occurrent that depends on
          material participants and does something. January is a temporal region,
          a part of time itself with no participants. The statement is expressed
          by relating the process to the temporal region it occupies (the
          reaction occupies, or occurs during, that temporal interval). A reaction
          is not itself a temporal region because it is more than a stretch of
          time: it involves participants and change, whereas a temporal region is
          pure time, the container the process occupies.
      - question: |
          Someone proposes modeling "membership in a club" as a quality of a
          person. Using BFO's quality-versus-role distinction, why is that the
          wrong classification, and what is the right one?
        expected_answer: |
          Membership in a club is externally grounded and contingent: a person
          gains or loses it depending on their relationship to an institution,
          without any change in their intrinsic physical makeup, and it is not
          fully exhibited simply by being borne. That is the signature of a role,
          not a quality. A quality (like mass or color) is intrinsic and fully
          present whenever borne. So BFO classifies club membership as a role -- a
          realizable, context-dependent dependent continuant the person bears --
          which correctly lets the membership be acquired and dropped over time
          while the person's intrinsic classification stays fixed.

  - name: "Mondo"
    display_name: "Mondo Disease Ontology"
    owl_file: "s3://neurosymbolicdl-storage-ontologybucket795a3498-gjp5avevev34/ontologies/mondo.owl"
    # Mondo Disease Ontology (Monarch Initiative, https://mondo.monarchinitiative.org/)
    # -- an OBO Foundry ontology that provides a single, coherent classification
    # of human (and some non-human) DISEASES, harmonizing the many overlapping
    # disease resources (OMIM, Orphanet, NCIt, DOID, ICD, SNOMED, etc.) into one
    # logically consistent hierarchy. Mondo's distinctive contribution is
    # cross-resource EQUIVALENCE: it asserts which disease terms across those
    # sources denote the same disease (skos:exactMatch / equivalentTo), so a
    # Mondo id acts as a stable, source-neutral "hub" identifier. Diseases are
    # organized by is-a subtype hierarchy and characterized by relations such as
    # has-material-basis-in (a causal gene/variant) and disease-has-location
    # (the affected anatomy). The eval set has two complementary kinds of
    # question so the evolved program stays competent at BOTH:
    #   (a) factual lookups of concepts Mondo actually defines (disease
    #       classifications, subtype/parent relationships, genetic basis,
    #       anatomical location, and cross-references/equivalences), and
    #   (b) interpretive "what does this classification / mapping mean" questions.
    # Every expected_answer stays grounded in Mondo's real class hierarchy,
    # cross-references, and definitions so the neurosymbolic retrieval drives the
    # answer rather than free speculation.
    questions:
      # --- (a) Factual concept lookups ---
      - question: "What is 'cystic fibrosis' classified as in Mondo, and what is its genetic basis?"
        expected_answer: |
          Mondo classifies cystic fibrosis (MONDO:0009061) as an autosomal
          recessive disease and, more broadly, a genetic/hereditary respiratory
          and digestive disorder. Its material basis is the CFTR gene: the
          disease has-material-basis-in pathogenic variants of CFTR, which impair
          the chloride channel and cause the characteristic thick mucus affecting
          the lungs and pancreas.
      - question: "How does Mondo relate 'type 1 diabetes mellitus' and 'type 2 diabetes mellitus'?"
        expected_answer: |
          In Mondo both type 1 diabetes mellitus (MONDO:0005147) and type 2
          diabetes mellitus (MONDO:0005148) are subtypes (is-a children) of
          diabetes mellitus (MONDO:0005015). They are sibling classes under the
          same parent -- distinguished by mechanism (autoimmune beta-cell
          destruction vs. insulin resistance) -- rather than one being a subtype
          of the other.
      - question: "What is the purpose of a Mondo cross-reference such as an OMIM or Orphanet mapping?"
        expected_answer: |
          Mondo's cross-references record which terms in other disease resources
          (OMIM, Orphanet, NCIt, DOID, ICD, SNOMED, etc.) denote the same
          disease as a given Mondo class. The strongest of these are equivalence
          mappings (skos:exactMatch), which assert the source term and the Mondo
          term are the SAME disease. This lets a single Mondo id act as a stable,
          source-neutral hub that unifies data annotated against many different
          vocabularies.
      - question: "How does Mondo represent 'Marfan syndrome'?"
        expected_answer: |
          Mondo represents Marfan syndrome (MONDO:0007947) as an autosomal
          dominant hereditary disorder -- a connective tissue disease whose
          material basis is pathogenic variants in the FBN1 gene (fibrillin-1).
          It carries cross-references (e.g. to OMIM and Orphanet) that assert
          equivalence with those resources' Marfan syndrome terms, and it sits in
          the connective-tissue / syndromic disease branch of the hierarchy.
      - question: "What does the Mondo relationship 'has material basis in' express?"
        expected_answer: |
          'Has material basis in' links a disease to the underlying causal
          entity -- typically a gene or a specific pathogenic variant -- that the
          disease arises from. For a Mendelian disorder it names the causative
          gene (e.g. cystic fibrosis has-material-basis-in CFTR), making the
          genetic etiology explicit and queryable rather than buried in free text.
      - question: "What is a 'rare disease' designation in Mondo?"
        expected_answer: |
          Mondo tags many classes as rare diseases (often via a subset/slim such
          as the Orphanet-derived rare-disease subset), meaning the disease
          affects a small fraction of the population. These designations, drawn
          largely from Orphanet, let the hierarchy distinguish rare disorders and
          group them, supporting rare-disease research and diagnosis.
      - question: "How does Mondo classify 'breast cancer'?"
        expected_answer: |
          Mondo classifies breast cancer (MONDO:0007254) as a subtype of
          carcinoma / malignant neoplasm localized to the breast -- a cancer
          (disease by is-a under neoplasm) with disease-location in the breast.
          It carries cross-references to the corresponding NCIt, DOID, and other
          resource terms asserting they denote the same disease.
      - question: "What is 'sickle cell anemia' in Mondo, including its parent and genetic cause?"
        expected_answer: |
          Mondo represents sickle cell anemia (MONDO:0011382) as an autosomal
          recessive hemoglobinopathy -- a subtype of anemia / inherited blood
          disorder. Its material basis is a specific pathogenic variant in the
          HBB (beta-globin) gene, which produces abnormal hemoglobin S and the
          characteristic sickling of red blood cells.

      # --- (b) Interpretive "what does this classification / mapping mean" questions ---
      - question: |
          A dataset annotates patients using OMIM ids, another using Orphanet
          ids, for what turns out to be the same condition. How does Mondo's use
          of equivalence cross-references let me reconcile them, and what does that
          practically buy an analysis?
        expected_answer: |
          Mondo asserts, for each disease it covers, which OMIM, Orphanet, and
          other source terms are equivalent (skos:exactMatch) to its own class.
          Practically, mapping both datasets' ids up to their shared Mondo id
          collapses the two vocabularies onto one hub identifier, so records that
          used different source ids for the same disease become directly
          comparable and can be aggregated. This is Mondo's core value: it lets an
          analysis integrate cohorts annotated against different disease resources
          without manually curating cross-walks, because the equivalence is
          already encoded in the ontology.
      - question: |
          A disease is recorded in Mondo with 'has material basis in' a specific
          gene and an is-a path up to a broad disease category. Walking through
          Mondo's model, what does that combination tell me about the disease?
        expected_answer: |
          The two axes answer different questions. The is-a path places the
          disease in the classification -- what KIND of disease it is (e.g. a
          connective-tissue disorder, a cancer, an anemia) by inheriting from
          progressively broader parents. The 'has material basis in' relation
          names the causal entity -- the gene or variant the disease ARISES from.
          Together they tell me both the category the disease belongs to and its
          molecular etiology, so I can reason up the hierarchy to find related
          diseases of the same type and, separately, group diseases by shared
          causal gene -- two independent, queryable views Mondo keeps distinct.
      - question: |
          Two source terms map to the same Mondo class, but one mapping is an
          exact match and the other is only a broad/related match. Using how Mondo
          distinguishes mapping types, how should I treat each?
        expected_answer: |
          Mondo grades its cross-references by mapping precision. An exact match
          (skos:exactMatch) asserts the source term and the Mondo class denote the
          SAME disease, so it is safe to treat records under that source term as
          being about the Mondo disease. A broad (or related/narrow) match only
          asserts a looser relationship -- the source term is more general than,
          or merely related to, the Mondo class -- so it must NOT be treated as
          equivalence: data under it may include other diseases. Practically, I
          integrate on exact matches and handle broader/related matches cautiously
          (or exclude them) to avoid conflating distinct conditions.
      - question: |
          Why does Mondo exist as a separate "hub" ontology when resources like
          OMIM, Orphanet, NCIt and DOID already classify diseases? What problem
          does it solve?
        expected_answer: |
          Each existing resource classifies diseases for its own purpose and with
          its own identifiers, scope, and granularity, so the same disease appears
          under different, non-interoperable ids and the classifications disagree
          or overlap inconsistently. Mondo solves this by providing a single,
          logically coherent is-a hierarchy and, crucially, encoding equivalence
          mappings that state which terms across all those resources are the same
          disease. Practically it acts as a unifying hub: data annotated against
          any of the member vocabularies can be brought together under stable
          Mondo ids, giving one consistent classification to reason over instead
          of many clashing ones.
      - question: |
          A patient's condition is placed under a broad Mondo parent class with
          several more specific child subtypes. What does sitting at that level of
          the hierarchy practically imply for interpreting the diagnosis?
        expected_answer: |
          Placement at a broad parent rather than a specific child means the
          diagnosis has been characterized only to that general category, while
          the more precise subtypes beneath it remain undifferentiated. Practically
          it implies the disease kind is known but its specific form is not yet
          pinned down -- so, via Mondo's is-a hierarchy, the possible refinements
          are exactly that class's children, and any reasoning should apply only
          what is true of the broad category, not assume features specific to one
          subtype. It flags where additional information (genetic, clinical) could
          move the diagnosis down to a more specific Mondo class.
